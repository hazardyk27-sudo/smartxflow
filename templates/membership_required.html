<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Required - SmartXFlow</title>
<link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v('css/auth.css') }}">
</head>
<body class="sxf-auth-body">
  <div class="sxf-auth-card">
    <div class="sxf-icon-wrap">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    </div>
    <div class="sxf-auth-logo">Smart<span>X</span>Flow</div>
    <p class="sxf-center-text" style="margin-top:14px;">
      Your account does not have an active membership. Choose a membership plan or
      contact our support team to access SmartXFlow.
    </p>

    <a href="mailto:smartxflow29@gmail.com" class="sxf-btn" style="display:block;text-align:center;text-decoration:none;line-height:1.3;padding-top:13px;">
      Contact Support
    </a>

    <div class="sxf-footer-link">
      Have an existing license key? <a href="/migrate-account">Move it to an account</a>
    </div>
    <div class="sxf-footer-link">
      <a href="#" id="logoutLink">Sign out</a>
    </div>
  </div>
<script>
document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/auth/logout', {method: 'POST'}).catch(()=>{});
  window.location.href = '/login';
});
</script>
</body>
</html>
