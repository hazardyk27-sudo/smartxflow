<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeni Şifre Belirle - SmartXFlow</title>
<link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v('css/auth.css') }}">
</head>
<body class="sxf-auth-body">
  <div class="sxf-auth-card">
    <div class="sxf-auth-logo">Smart<span>X</span>Flow</div>
    <p class="sxf-auth-title">Yeni şifrenizi belirleyin</p>

    <div class="sxf-error" id="errBox"></div>
    <div class="sxf-success" id="okBox"></div>

    <form id="resetForm">
      <div class="sxf-field">
        <label for="password">Yeni Şifre</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="sxf-field">
        <label for="password2">Yeni Şifre (tekrar)</label>
        <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="sxf-btn" id="submitBtn">Şifreyi Güncelle</button>
    </form>
  </div>

<script>
const errBox = document.getElementById('errBox');
const okBox = document.getElementById('okBox');
const form = document.getElementById('resetForm');
const submitBtn = document.getElementById('submitBtn');

function getTokensFromHash() {
  const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
  const params = new URLSearchParams(hash);
  return {
    access_token: params.get('access_token') || sessionStorage.getItem('sxf_recovery_access_token') || '',
    refresh_token: params.get('refresh_token') || sessionStorage.getItem('sxf_recovery_refresh_token') || '',
  };
}

const tokens = getTokensFromHash();
if (tokens.access_token) {
  sessionStorage.setItem('sxf_recovery_access_token', tokens.access_token);
  sessionStorage.setItem('sxf_recovery_refresh_token', tokens.refresh_token);
}

if (!tokens.access_token) {
  errBox.textContent = 'Geçersiz veya süresi dolmuş bağlantı. Lütfen şifre sıfırlamayı tekrar başlatın.';
  errBox.style.display = 'block';
  form.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  if (p1 !== p2) {
    errBox.textContent = 'Şifreler eşleşmiyor.';
    errBox.style.display = 'block';
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = 'Güncelleniyor...';
  try {
    const resp = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({access_token: tokens.access_token, refresh_token: tokens.refresh_token, password: p1}),
    });
    const data = await resp.json();
    if (data.ok) {
      sessionStorage.removeItem('sxf_recovery_access_token');
      sessionStorage.removeItem('sxf_recovery_refresh_token');
      okBox.textContent = 'Şifreniz güncellendi. Giriş sayfasına yönlendiriliyorsunuz...';
      okBox.style.display = 'block';
      form.style.display = 'none';
      setTimeout(() => window.location.href = '/login', 1800);
    } else {
      errBox.textContent = 'Şifre güncellenemedi. Bağlantının süresi dolmuş olabilir.';
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Şifreyi Güncelle';
    }
  } catch (e) {
    errBox.textContent = 'Bağlantı hatası.';
    errBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Şifreyi Güncelle';
  }
});
</script>
</body>
</html>
