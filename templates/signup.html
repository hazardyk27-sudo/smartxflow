<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıt Ol - SmartXFlow</title>
<link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v('css/auth.css') }}">
</head>
<body class="sxf-auth-body">
  <div class="sxf-auth-card">
    <div class="sxf-auth-logo">Smart<span>X</span>Flow</div>
    <p class="sxf-auth-title">Yeni hesap oluşturun</p>

    <div class="sxf-error" id="errBox"></div>

    <form id="signupForm" autocomplete="on">
      <div class="sxf-field">
        <label for="displayName">Ad (opsiyonel)</label>
        <input type="text" id="displayName" name="displayName" autocomplete="name">
      </div>
      <div class="sxf-field">
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="sxf-field">
        <label for="password">Şifre</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="sxf-btn" id="submitBtn">Kayıt Ol</button>
    </form>

    <div class="sxf-footer-link">
      Zaten hesabınız var mı? <a href="/login">Giriş Yap</a>
    </div>
  </div>

<script>
const form = document.getElementById('signupForm');
const errBox = document.getElementById('errBox');
const submitBtn = document.getElementById('submitBtn');

const ERR_MSG = {
  INVALID_EMAIL: 'Geçerli bir e-posta adresi girin.',
  PASSWORD_TOO_SHORT: 'Şifre en az 8 karakter olmalı.',
  PASSWORD_TOO_WEAK: 'Şifre çok zayıf, daha güçlü bir şifre seçin.',
  EMAIL_ALREADY_REGISTERED: 'Bu e-posta zaten kayıtlı. Giriş yapmayı deneyin.',
  AUTH_UNAVAILABLE: 'Kimlik doğrulama servisine ulaşılamıyor.',
  SIGNUP_FAILED: 'Kayıt oluşturulamadı, tekrar deneyin.',
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Kayıt oluşturuluyor...';
  try {
    const resp = await fetch('/api/auth/signup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        display_name: document.getElementById('displayName').value.trim(),
      }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) {
      errBox.textContent = ERR_MSG[data.error] || 'Kayıt oluşturulamadı.';
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kayıt Ol';
      return;
    }
    sessionStorage.setItem('sxf_pending_email', data.email);
    window.location.href = '/verify-email';
  } catch (err) {
    errBox.textContent = 'Bağlantı hatası, tekrar deneyin.';
    errBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Kayıt Ol';
  }
});
</script>
</body>
</html>
