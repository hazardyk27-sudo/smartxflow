<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - SmartXFlow</title>
<link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v('css/auth.css') }}">
</head>
<body class="sxf-auth-body">
  <div class="sxf-auth-card">
    <div class="sxf-auth-logo">Smart<span>X</span>Flow</div>
    <p class="sxf-auth-title">Sign in to your account</p>

    <div class="sxf-error" id="errBox"></div>

    <form id="loginForm" autocomplete="on">
      <div class="sxf-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="sxf-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="sxf-btn" id="submitBtn">Sign In</button>
    </form>

    <button type="button" class="sxf-btn-secondary" id="testModeBtn">Try Test Mode Without an Account</button>

    <div class="sxf-footer-link" style="margin-top:14px;">
      <a href="/forgot-password">Forgot your password?</a>
    </div>
    <div class="sxf-footer-link">
      Don't have an account? <a href="/signup">Sign Up</a>
    </div>
    <div class="sxf-footer-link">
      Have an existing license key? <a href="/migrate-account">Move it to an account</a>
    </div>
  </div>

<script>
const nextPath = {{ next_path | tojson }};
const form = document.getElementById('loginForm');
const errBox = document.getElementById('errBox');
const submitBtn = document.getElementById('submitBtn');

const ERR_MSG = {
  MISSING_CREDENTIALS: 'Enter your email and password.',
  INVALID_CREDENTIALS: 'Your email or password is incorrect.',
  ACCOUNT_DELETED: 'This account has been deleted.',
  AUTH_UNAVAILABLE: 'The authentication service is unavailable.',
  LOGIN_FAILED: 'Sign-in failed. Please try again.',
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Giriş yapılıyor...';
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) {
      errBox.textContent = ERR_MSG[data.error] || 'Sign-in failed.';
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }
    window.location.href = data.next || nextPath || '/app';
  } catch (err) {
    errBox.textContent = 'Connection error. Please try again.';
    errBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign In';
  }
});

document.getElementById('testModeBtn').addEventListener('click', async () => {
  try {
    const resp = await fetch('/api/test/activate', {method: 'POST'});
    const data = await resp.json();
    if (data.success) window.location.href = '/app';
  } catch (e) {}
});
</script>
</body>
</html>
