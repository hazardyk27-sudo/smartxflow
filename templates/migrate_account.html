<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Move License to Account - SmartXFlow</title>
<link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v('css/auth.css') }}">
</head>
<body class="sxf-auth-body">
  <div class="sxf-auth-card">
    <div class="sxf-auth-logo">Smart<span>X</span>Flow</div>
    <p class="sxf-auth-title">Move your license key to an account</p>
    <p class="sxf-center-text">
      SmartXFlow now uses email and password sign-in. Create a new account once with
      your existing license key and your membership will be transferred automatically.
    </p>

    <div class="sxf-error" id="errBox"></div>

    <form id="migrateForm" autocomplete="on">
      <div class="sxf-field">
        <label for="licenseKey">License Key</label>
        <input type="text" id="licenseKey" name="licenseKey" required placeholder="SXF-XXXX-XXXX-XXXX" style="text-transform:uppercase;">
      </div>
      <div class="sxf-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="sxf-field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="sxf-btn" id="submitBtn">Create Account and Move License</button>
    </form>

    <div class="sxf-footer-link"><a href="/login">Back to sign in</a></div>
  </div>

<script>
const form = document.getElementById('migrateForm');
const errBox = document.getElementById('errBox');
const submitBtn = document.getElementById('submitBtn');

const ERR_MSG = {
  LICENSE_NOT_FOUND: 'This license key was not found.',
  LICENSE_REVOKED: 'This license has been revoked.',
  LICENSE_EXPIRED: 'This license has expired.',
  LICENSE_ALREADY_MIGRATED: 'This license has already been moved to an account. Try signing in.',
  EMAIL_ALREADY_REGISTERED: 'This email is already registered. Try signing in.',
  INVALID_EMAIL: 'Enter a valid email address.',
  PASSWORD_TOO_SHORT: 'Password must be at least 8 characters.',
  INVALID_INPUT: 'Please complete all fields.',
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Moving license...';
  try {
    const resp = await fetch('/api/auth/migrate-key', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        license_key: document.getElementById('licenseKey').value.trim().toUpperCase(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) {
      errBox.textContent = ERR_MSG[data.error] || 'License transfer failed.';
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account and Move License';
      return;
    }
    sessionStorage.setItem('sxf_pending_email', data.email);
    window.location.href = '/verify-email';
  } catch (err) {
    errBox.textContent = 'Connection error. Please try again.';
    errBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Account and Move License';
  }
});
</script>
</body>
</html>
