<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifremi Unuttum - SmartXFlow</title>
<link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v('css/auth.css') }}">
</head>
<body class="sxf-auth-body">
  <div class="sxf-auth-card">
    <div class="sxf-auth-logo">Smart<span>X</span>Flow</div>
    <p class="sxf-auth-title">Şifrenizi sıfırlayın</p>

    <div id="formStep">
      <p class="sxf-center-text">E-posta adresinizi girin, size bir şifre sıfırlama bağlantısı gönderelim.</p>
      <div class="sxf-error" id="errBox"></div>
      <form id="forgotForm">
        <div class="sxf-field">
          <label for="email">E-posta</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <button type="submit" class="sxf-btn" id="submitBtn">Sıfırlama Bağlantısı Gönder</button>
      </form>
    </div>

    <div id="sentStep" style="display:none;">
      <div class="sxf-success" style="display:block;">
        Eğer bu e-posta ile kayıtlı bir hesap varsa, bir şifre sıfırlama bağlantısı gönderildi. Gelen kutunuzu kontrol edin.
      </div>
    </div>

    <div class="sxf-footer-link"><a href="/login">Girişe geri dön</a></div>
  </div>

<script>
const form = document.getElementById('forgotForm');
const errBox = document.getElementById('errBox');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Gönderiliyor...';
  try {
    await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: document.getElementById('email').value.trim()}),
    });
  } catch (e) {}
  document.getElementById('formStep').style.display = 'none';
  document.getElementById('sentStep').style.display = 'block';
});
</script>
</body>
</html>
