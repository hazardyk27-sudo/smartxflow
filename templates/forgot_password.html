<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - SmartXFlow</title>
<link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v('css/auth.css') }}">
</head>
<body class="sxf-auth-body">
  <div class="sxf-auth-card">
    <div class="sxf-auth-logo">Smart<span>X</span>Flow</div>
    <p class="sxf-auth-title">Reset your password</p>

    <div id="formStep">
      <p class="sxf-center-text">Enter your email address and we'll send you a password reset link.</p>
      <div class="sxf-error" id="errBox"></div>
      <form id="forgotForm">
        <div class="sxf-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <button type="submit" class="sxf-btn" id="submitBtn">Send Reset Link</button>
      </form>
    </div>

    <div id="sentStep" style="display:none;">
      <div class="sxf-success" style="display:block;">
        If an account exists for this email, a password reset link has been sent. Check your inbox.
      </div>
    </div>

    <div class="sxf-footer-link"><a href="/login">Back to sign in</a></div>
  </div>

<script>
const form = document.getElementById('forgotForm');
const errBox = document.getElementById('errBox');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending...';
  try {
    await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: document.getElementById('email').value.trim()}),
    });
  } catch (e) {}
  document.getElementById('formStep').style.display = 'none';
  document.getElementById('sentStep').style.display = 'block';
});
</script>
</body>
</html>
