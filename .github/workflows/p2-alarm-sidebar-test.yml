name: P2.19 Alarm Sidebar Split

on:
  push:
    branches: [perf/p2-alarm-sidebar-split]
    paths:
      - 'static/js/app.js'
      - 'static/js/app.js.src'
      - 'static/js/alarm-sidebar.js'
      - 'static/js/alarm-sidebar.js.src'
      - 'tests/test_alarm_sidebar_code_split.js'
      - 'tests/test_alarm_identity.js'
      - '.github/workflows/p2-alarm-sidebar-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-alarm-sidebar-split
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax checks
        run: |
          node --check static/js/app.js
          node --check static/js/alarm-sidebar.js
      - name: Test P2.19 alarm sidebar split
        run: node --test tests/test_alarm_sidebar_code_split.js
      - name: Test alarm identity
        run: node --test tests/test_alarm_identity.js
      - name: Run canonical frontend regression suite
        run: |
          python -m pytest -q tests/test_deferred_analysis_ui.py
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_modal_entry_code_split.js
          node --test tests/test_modal_info_code_split.js
          node --test tests/test_mobile_chart_panel_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_modal_chart_helper_split.js
          node --test tests/test_chart_export_code_split.js
          node --test tests/test_sort_hotpath_debug_cleanup.js
          node --test tests/test_production_debug_log_cleanup.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_app_bootstrap.js
      - name: Diff check
        run: git diff --check
