name: Temp P3 Interaction Regression

on:
  push:
    branches: [perf/p3-interaction-latency]

permissions:
  contents: read

jobs:
  p3-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run focused interaction regressions
        run: |
          node --test tests/test_modal_entry_code_split.js
          node --test tests/test_modal_data_pipeline_split.js
          node --test tests/test_modal_history_cache_key.js
          node --test tests/test_interaction_warmup.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_live_tab_code_split.js
          node --test tests/test_admin_panel_code_split.js
