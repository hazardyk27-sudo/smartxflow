name: Verify T72 snapshot source fidelity and 180-second capture

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/base-source-quality-checks-20261021.yml'

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source test dependencies
        run: python -m pip install -q pytest requests beautifulsoup4 certifi
      - name: Test 1X2 source identity and snapshot telemetry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python -m pytest -q \
            tests/test_betwatch_1x2_mapping_20261021.py \
            tests/test_moneyway_ingest_quality_20261021.py \
            tests/test_moneyway_zero_volume_provenance_20261021.py \
            tests/test_prematch_t72_capture_cadence_20261021.py \
            tests/test_runtime_scraper_recovery.py \
            tests/test_betwatch_prematch_identity_runtime.py > /tmp/source-tests.log 2>&1
          RC=$?
          {
            echo "commit=$GITHUB_SHA"
            echo "pytest_exit_code=$RC"
            tail -n 100 /tmp/source-tests.log
          } | tee /tmp/source-report.txt
          DATA="$(base64 -w0 /tmp/source-report.txt)"
          DEST="repos/$GITHUB_REPOSITORY/contents/docs/MONEYWAY_SOURCE_TEST_REPORT_20261021.txt"
          OLD="$(gh api "$DEST?ref=preview" --jq .sha 2>/dev/null || true)"
          if [ -n "$OLD" ]; then
            gh api -X PUT "$DEST" -f message="test(source): publish Moneyway ingest checks" -f branch=preview -f content="$DATA" -f sha="$OLD" --jq .commit.sha || true
          else
            gh api -X PUT "$DEST" -f message="test(source): publish Moneyway ingest checks" -f branch=preview -f content="$DATA" --jq .commit.sha || true
          fi
          exit "$RC"
