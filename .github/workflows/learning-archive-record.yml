name: Learning Archive Record Gate

on:
  push:
    branches:
      - preview
    paths:
      - 'learning_archive_queue/*.json'

permissions:
  contents: write

concurrency:
  group: learning-archive-record-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve exactly one queue payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^learning_archive_queue/.*\.json$' || true)
          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "ARCHIVE_GATE_STOP: expected exactly one learning_archive_queue/*.json change, got ${#FILES[@]}"
            printf '%s\n' "${FILES[@]:-}"
            exit 1
          fi
          FILE="${FILES[0]}"
          python -m json.tool "$FILE" >/dev/null

          RESOLVED="$(python - "$FILE" <<'PY'
          import json
          import pathlib
          import sys

          changed = pathlib.Path(sys.argv[1])
          payload = json.loads(changed.read_text(encoding='utf-8'))
          retry_of = payload.get('retry_of') if isinstance(payload, dict) else None
          target = pathlib.Path(retry_of) if retry_of else changed
          if target.is_absolute() or '..' in target.parts:
              raise SystemExit('ARCHIVE_GATE_STOP: invalid retry_of path')
          if target.suffix != '.json' or not str(target).startswith('learning_archive_queue/'):
              raise SystemExit('ARCHIVE_GATE_STOP: retry_of must reference learning_archive_queue/*.json')
          if not target.exists():
              raise SystemExit('ARCHIVE_GATE_STOP: retry_of target does not exist')
          target_payload = json.loads(target.read_text(encoding='utf-8'))
          cases = target_payload.get('cases') if isinstance(target_payload, dict) else None
          if not isinstance(cases, list) or not cases:
              raise SystemExit('ARCHIVE_GATE_STOP: resolved queue contains no cases')
          print(target)
          PY
          )"

          python -m json.tool "$RESOLVED" >/dev/null
          B64="$(base64 -w0 "$RESOLVED")"
          echo "QUEUE_FILE=$FILE" >> "$GITHUB_ENV"
          echo "RESOLVED_QUEUE_FILE=$RESOLVED" >> "$GITHUB_ENV"
          echo "QUEUE_B64=$B64" >> "$GITHUB_ENV"

      - name: Record all formal cases with durable receipts
        uses: appleboy/ssh-action@v1.0.3
        env:
          QUEUE_B64: ${{ env.QUEUE_B64 }}
          GH_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: QUEUE_B64,GH_TOKEN
          script: |
            set -euo pipefail
            cd /opt/smartxflow

            BRANCH="$(git branch --show-current)"
            if [ "$BRANCH" != "main" ]; then
              echo "ARCHIVE_GATE_STOP: production runtime branch is '$BRANCH', expected main"
              exit 1
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ARCHIVE_GATE_STOP: tracked production worktree is dirty"
              git status --short
              exit 1
            fi

            TMP="$(mktemp /tmp/sxf-stage3-batch.XXXXXX.json)"
            trap 'rm -f "$TMP"' EXIT
            printf '%s' "$QUEUE_B64" | base64 -d > "$TMP"

            export GH_TOKEN
            /opt/smartxflow/venv/bin/python - "$TMP" <<'PY'
            import json
            import os
            import sys

            batch_file = sys.argv[1]

            # Load production dotenv literally into this process. Never shell-source it.
            with open('/opt/smartxflow/.env', 'r', encoding='utf-8') as fh:
                for raw in fh:
                    line = raw.strip()
                    if not line or line.startswith('#') or '=' not in line:
                        continue
                    key, value = line.split('=', 1)
                    key = key.strip()
                    value = value.strip()
                    if key.startswith('export '):
                        key = key[7:].strip()
                    if len(value) >= 2 and value[0] == value[-1] and value[0] in ('"', "'"):
                        value = value[1:-1]
                    if key:
                        os.environ[key] = value

            os.environ['GITHUB_TOKEN'] = os.environ['GH_TOKEN']
            if '/opt/smartxflow' not in sys.path:
                sys.path.insert(0, '/opt/smartxflow')

            from learning_archive.exporter import ArchiveFinalizationError, LearningArchiveExporter
            from learning_archive.supabase_source import read_learning_archive_match_history

            payload = json.load(open(batch_file, 'r', encoding='utf-8'))
            cases = payload['cases'] if isinstance(payload, dict) and isinstance(payload.get('cases'), list) else payload
            if not isinstance(cases, list) or not cases:
                raise SystemExit('ARCHIVE_GATE_STOP: batch contains no cases')

            exporter = LearningArchiveExporter.from_env()
            receipts = []
            failures = []

            def flatten_history(history_payload):
                rows = []
                for table_name, table_rows in history_payload.histories.items():
                    for row in table_rows:
                        copied = dict(row)
                        copied['_archive_source_table'] = table_name
                        rows.append(copied)
                rows.sort(key=lambda row: (
                    str(row.get('scraped_at') or row.get('scraped_at_utc') or row.get('snapshot_at') or row.get('created_at') or ''),
                    str(row.get('_archive_source_table') or ''),
                ))
                return rows

            for index, case in enumerate(cases):
                case_id = str(case.get('case_id') or f'index:{index}')
                try:
                    match_hash = case['match']['match_id_hash']
                    observed_at = case['provenance']['archive_created_at']
                    history = read_learning_archive_match_history(match_hash)
                    snapshots = flatten_history(history)
                    if not snapshots:
                        raise RuntimeError(f'no stored SXF history found for {match_hash}')
                    result = exporter.record_case(case, snapshots, observed_at=observed_at, revisit=False)
                    if result.status != 'RECORDED':
                        raise ArchiveFinalizationError(f'unexpected archive status {result.status}')
                    receipts.append({
                        'case_id': case_id,
                        'status': result.status,
                        'archive_reference': result.archive_reference,
                        'archive_commit': result.archive_commit,
                        'checksum_summary': result.checksum_summary,
                        'idempotent': result.idempotent,
                        'source_tables': list(history.source_tables),
                        'unavailable_optional_tables': list(history.unavailable_optional_tables),
                    })
                except Exception as exc:
                    failures.append({'case_id': case_id, 'error': str(exc)})

            result_payload = {
                'status': 'BATCH_RECORDED' if not failures else 'BATCH_PARTIAL_FAILED',
                'requested': len(cases),
                'recorded': len(receipts),
                'failed': len(failures),
                'receipts': receipts,
                'failures': failures,
            }
            stream = sys.stdout if not failures else sys.stderr
            print(json.dumps(result_payload, ensure_ascii=False, sort_keys=True), file=stream)
            raise SystemExit(0 if not failures else 1)
            PY

      - name: Gate result
        run: |
          echo "ARCHIVE_GATE_OK queue=$QUEUE_FILE resolved=$RESOLVED_QUEUE_FILE"
