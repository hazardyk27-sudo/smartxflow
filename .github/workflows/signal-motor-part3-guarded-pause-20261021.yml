name: Signal Motor Part3 - guarded Hetzner worker pause
on:
  push:
    branches: [preview]
    paths: ['docs/SIGNAL_MOTOR_PART3_PAUSE_TRIGGER_20261021.txt']
permissions:
  contents: write
concurrency:
  group: sxf-signal-motor-part3-cutover
  cancel-in-progress: false
jobs:
  pause:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Stop autonomous Base and recovery before claim RPC migration
        id: pause
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            test "$(hostname)" = smartxflow
            test "$(sudo -u smartxflow git -C /opt/smartxflow branch --show-current)" = main
            test "$(sudo -u smartxflow git -C /opt/smartxflow rev-parse HEAD)" = 73dd9ffcd6869014a39d2215bdcabbf29cd4cbbc
            sudo -u smartxflow git -C /opt/smartxflow diff --quiet
            sudo -u smartxflow git -C /opt/smartxflow diff --cached --quiet
            test "$(sudo /bin/systemctl is-active smartxflow-base-worker.service)" = active
            test "$(sudo /bin/systemctl is-active smartxflow-base-guarded-recovery.timer)" = active
            test "$(sudo /bin/systemctl is-enabled smartxflow-base-worker.service)" = enabled
            test "$(sudo /bin/systemctl is-enabled smartxflow-base-guarded-recovery.timer)" = enabled
            sudo /bin/systemctl stop smartxflow-base-guarded-recovery.timer
            sudo /bin/systemctl disable smartxflow-base-guarded-recovery.timer
            sudo /bin/systemctl stop smartxflow-base-guarded-recovery.service
            sudo /bin/systemctl stop smartxflow-base-worker.service
            sudo /bin/systemctl disable smartxflow-base-worker.service
            test "$(sudo /bin/systemctl is-active smartxflow-base-worker.service || true)" != active
            test "$(sudo /bin/systemctl is-active smartxflow-base-guarded-recovery.timer || true)" != active
            test "$(sudo /bin/systemctl is-enabled smartxflow-base-worker.service || true)" = disabled
            test "$(sudo /bin/systemctl is-enabled smartxflow-base-guarded-recovery.timer || true)" = disabled
            test "$(sudo -u smartxflow git -C /opt/smartxflow rev-parse HEAD)" = 73dd9ffcd6869014a39d2215bdcabbf29cd4cbbc
            echo "PART3_PAUSE_OK base=inactive recovery=inactive both=disabled sha=73dd9ffcd6869014a39d2215bdcabbf29cd4cbbc"
      - name: Publish exact pause outcome to preview
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.pause.outcome }}
        run: |
          set -euo pipefail
          printf 'source_sha=%s\nexpected_production_sha=73dd9ffcd6869014a39d2215bdcabbf29cd4cbbc\npause_step=%s\n' "$GITHUB_SHA" "$OUTCOME" > /tmp/part3-pause.txt
          DATA="$(base64 -w0 /tmp/part3-pause.txt)"
          DEST="repos/$GITHUB_REPOSITORY/contents/docs/SIGNAL_MOTOR_PART3_PAUSE_STATUS_20261021.txt"
          OLD="$(gh api "$DEST?ref=preview" --jq .sha 2>/dev/null || true)"
          if [ -n "$OLD" ]; then
            gh api -X PUT "$DEST" -f branch=preview -f message='ops(signal): save Part3 guarded pause outcome' -f sha="$OLD" -f content="$DATA" --jq .commit.sha
          else
            gh api -X PUT "$DEST" -f branch=preview -f message='ops(signal): save Part3 guarded pause outcome' -f content="$DATA" --jq .commit.sha
          fi
