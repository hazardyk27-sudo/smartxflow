name: P2.15 Modal Info Split

on:
  push:
    branches: [perf/p2-modal-info-split]

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-modal-info-split
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install staging dependencies
        run: python -m pip install --disable-pip-version-check rjsmin pytest httpx pytz
      - name: Stage P2.15 split
        run: python scripts/_p2_modal_info_split_stage.py
      - name: Syntax checks
        run: |
          cp static/js/app.js.src /tmp/app-src.js
          cp static/js/modal-info.js.src /tmp/modal-info-src.js
          node --check /tmp/app-src.js
          node --check /tmp/modal-info-src.js
          node --check static/js/app.js
          node --check static/js/modal-info.js
          node --check static/js/modal-chart.js
          node --check static/js/modal-live.js
          node --check static/js/modal-alarms.js
          node --check static/js/chart-export.js
      - name: Run regressions
        run: |
          node --test tests/test_modal_info_code_split.js
          node --test tests/test_chart_export_code_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_modal_chart_helper_split.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_modal_live_code_split.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_favorites_bootstrap.js
          node --test tests/test_alarm_identity.js
          node --test tests/test_sort_hotpath_debug_cleanup.js
          node --test tests/test_production_debug_log_cleanup.js
          node --test tests/test_app_bootstrap.js
          python -m pytest -q tests/test_deferred_analysis_ui.py tests/test_favorites_bootstrap.py tests/test_hash.py
      - name: Diff check
        run: git diff --check
      - name: Commit tested product output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_p2_modal_info_split_stage.py
          git add static/js/app.js static/js/app.js.src static/js/modal-info.js static/js/modal-info.js.src minify.py tests/test_modal_info_code_split.js
          git commit -m "perf: defer modal info renderer"
          git push origin HEAD:perf/p2-modal-info-split
