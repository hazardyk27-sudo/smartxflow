name: Signal Retention

on:
  push:
    branches: [preview]
    paths:
      - 'scripts/cleanup_signal_retention.py'
      - '.github/workflows/signal-retention.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Delete analysis signals older than seven days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIGNAL_RETENTION_DAYS: '7'
        run: python scripts/cleanup_signal_retention.py
