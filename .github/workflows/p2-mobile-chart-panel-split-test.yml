name: P2.16 Mobile Chart Panel Split

on:
  push:
    branches: [perf/p2-mobile-chart-panel-split]
    paths:
      - 'scripts/_p2_mobile_chart_panel_split_stage.py'
      - 'scripts/_p2_mobile_chart_panel_compat.py'
      - '.github/workflows/p2-mobile-chart-panel-split-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-mobile-chart-panel-split
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install staging dependencies
        run: python -m pip install --disable-pip-version-check rjsmin pytest httpx pytz
      - name: Stage P2.16 split
        run: |
          python scripts/_p2_mobile_chart_panel_split_stage.py
          python scripts/_p2_mobile_chart_panel_compat.py
      - name: Syntax checks
        run: |
          node --check static/js/app.js
          node --check static/js/mobile-chart-panel.js
          node --check static/js/modal-chart.js
      - name: Run frontend regressions
        run: |
          node --test tests/test_mobile_chart_panel_split.js
          node --test tests/test_modal_info_code_split.js
          node --test tests/test_chart_export_code_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_modal_chart_helper_split.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_favorites_bootstrap.js
          node --test tests/test_alarm_identity.js
          node --test tests/test_app_bootstrap.js
          node --test tests/test_sort_hotpath_debug_cleanup.js
          node --test tests/test_production_debug_log_cleanup.js
      - name: Run Python regressions
        run: |
          python -m pytest -q tests/test_deferred_analysis_ui.py
          python -m pytest -q tests/test_favorites_bootstrap.py
          python -m pytest -q tests/test_hash.py
      - name: Diff check
        run: git diff --check
      - name: Commit tested product output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/app.js static/js/app.js.src static/js/mobile-chart-panel.js static/js/mobile-chart-panel.js.src minify.py tests/test_mobile_chart_panel_split.js .github/workflows/frontend-performance-tests.yml
          if git diff --cached --quiet; then
            echo 'No staged product changes'
            exit 1
          fi
          git commit -m 'perf: defer mobile chart value panel runtime'
          git push origin HEAD:perf/p2-mobile-chart-panel-split
