name: P2 Production Debug Log Cleanup Test

on:
  push:
    branches: [perf/p2-production-debug-log-cleanup]

permissions:
  contents: write

jobs:
  production-log-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-production-debug-log-cleanup
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Strip production console.log calls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def strip_console_logs(path):
              p = Path(path)
              text = p.read_text()
              before = len(text.encode())
              out = []
              i = 0
              removed = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              needle = 'console.log'

              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''

                  if line_comment:
                      out.append(ch)
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      out.append(ch)
                      if ch == '*' and nxt == '/':
                          out.append(nxt)
                          i += 2
                          block_comment = False
                      else:
                          i += 1
                      continue
                  if quote:
                      out.append(ch)
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch == '/' and nxt == '/':
                      out.extend((ch, nxt))
                      i += 2
                      line_comment = True
                      continue
                  if ch == '/' and nxt == '*':
                      out.extend((ch, nxt))
                      i += 2
                      block_comment = True
                      continue
                  if ch in ("'", '"', '`'):
                      out.append(ch)
                      quote = ch
                      i += 1
                      continue

                  if text.startswith(needle, i):
                      j = i + len(needle)
                      while j < len(text) and text[j].isspace():
                          j += 1
                      if j >= len(text) or text[j] != '(':
                          out.append(ch)
                          i += 1
                          continue

                      depth = 0
                      k = j
                      inner_quote = None
                      inner_escaped = False
                      inner_line_comment = False
                      inner_block_comment = False
                      while k < len(text):
                          c = text[k]
                          n = text[k + 1] if k + 1 < len(text) else ''
                          if inner_line_comment:
                              if c == '\n': inner_line_comment = False
                              k += 1; continue
                          if inner_block_comment:
                              if c == '*' and n == '/': inner_block_comment = False; k += 2
                              else: k += 1
                              continue
                          if inner_quote:
                              if inner_escaped: inner_escaped = False
                              elif c == '\\': inner_escaped = True
                              elif c == inner_quote: inner_quote = None
                              k += 1; continue
                          if c == '/' and n == '/': inner_line_comment = True; k += 2; continue
                          if c == '/' and n == '*': inner_block_comment = True; k += 2; continue
                          if c in ("'", '"', '`'): inner_quote = c; k += 1; continue
                          if c == '(':
                              depth += 1
                          elif c == ')':
                              depth -= 1
                              if depth == 0:
                                  k += 1
                                  break
                          k += 1
                      if depth != 0:
                          raise RuntimeError(f'{path}: unterminated console.log at offset {i}')

                      out.append('void 0')
                      removed += 1
                      i = k
                      continue

                  out.append(ch)
                  i += 1

              result = ''.join(out)
              if 'console.log(' in result or 'console.log (' in result:
                  raise RuntimeError(f'{path}: console.log leftovers remain')
              p.write_text(result)
              after = len(result.encode())
              delta = before - after
              print(f'{path}: removed {removed} console.log calls; {before} -> {after} ({delta} bytes removed)')
              return removed, delta

          src_count, src_delta = strip_console_logs('static/js/app.js.src')
          runtime_count, runtime_delta = strip_console_logs('static/js/app.js')
          if src_count < 35 or runtime_count < 35:
              raise SystemExit(f'unexpectedly few logs removed: src={src_count}, runtime={runtime_count}')
          if src_delta < 2500:
              raise SystemExit(f'source cleanup unexpectedly small: {src_delta}')
          if runtime_delta < 1800:
              raise SystemExit(f'runtime cleanup unexpectedly small: {runtime_delta}')
          PY

      - name: Frontend regression gates
        shell: bash
        run: |
          cp static/js/app.js.src /tmp/app-src.js
          node --check static/js/app.js
          node --check /tmp/app-src.js
          node --test tests/test_production_debug_log_cleanup.js
          node --test tests/test_sort_hotpath_debug_cleanup.js
          node --test tests/test_modal_chart_helper_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_modal_live_code_split.js
          node --test tests/test_app_bootstrap.js

      - name: Analysis entrypoint sentinel
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_deferred_analysis_ui.py
          node --test tests/test_deferred_analysis_entrypoints.js

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name "SmartXFlow CI"
          git config user.email "smartxflow-ci@users.noreply.github.com"
          git rm .github/workflows/p2-production-debug-log-test.yml
          git add static/js/app.js static/js/app.js.src tests/test_production_debug_log_cleanup.js
          git commit -m "perf: strip production debug logs"
          git push origin HEAD:perf/p2-production-debug-log-cleanup
