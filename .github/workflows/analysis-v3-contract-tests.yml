name: Analizler V3 Base Signal UI Contracts
on:
  push:
    branches: [preview]
    paths:
      - 'base_signal_engine/feed.py'
      - 'app.py'
      - 'templates/index.html'
      - 'static/js/base-signals.js'
      - 'static/css/base-signals.css'
      - 'tests/test_base_signals_feed.py'
      - 'tests/test_analysis_v3_template.py'
      - 'tests/test_analysis_v4_interactions.js'
      - 'tests/test_i18n_coverage.py'
      - 'static/i18n/**'
      - 'static/js/i18n.js'
      - 'static/js/app.js'
      - 'static/js/inline.js'
      - 'static/js/admin-panel.js'
      - 'static/js/admin-panel.js.src'
      - 'tests/test_admin_panel_i18n.js'
      - 'static/js/live-tab.js'
      - 'static/js/alarm-sidebar.js'
      - 'static/js/modal-alarms.js'
      - 'static/js/modal-info.js'
      - 'static/js/modal-chart.js'
      - 'static/js/modal-entry.js'
      - 'tests/test_runtime_i18n_contract.py'
      - 'tests/test_full_site_i18n_coverage.py'
      - 'tests/test_admin_i18n_catalog.py'
      - 'static/i18n/admin.json'
      - 'static/i18n/auth.json'
      - 'templates/**'
      - 'tests/test_live_alarm_i18n.js'
      - 'tests/test_i18n_switch_race.js'
      - '.github/workflows/analysis-v3-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-feed-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.2' 'requests==2.31.0'
      - name: Run API/data/HTML contracts
        run: python -m pytest -q tests/test_base_signals_feed.py tests/test_analysis_v3_template.py tests/test_deferred_analysis_ui.py tests/test_i18n_coverage.py tests/test_runtime_i18n_contract.py tests/test_full_site_i18n_coverage.py tests/test_admin_i18n_catalog.py
      - name: Validate JavaScript
        run: |
          node --check static/js/base-signals.js
          node --check static/js/app.js
          node --check static/js/live-tab.js
          node --check static/js/alarm-sidebar.js
          node --check static/js/modal-chart.js
          node --check static/js/modal-info.js
          node --check static/js/admin-panel.js
          node --test tests/test_deferred_analysis_entrypoints.js tests/test_analysis_v4_interactions.js tests/test_i18n_switch_race.js tests/test_live_alarm_i18n.js tests/test_admin_panel_i18n.js
