name: Learning Archive Settlement Tests

on:
  push:
    branches: [preview]
    paths:
      - 'learning_archive/settlement.py'
      - 'tests/test_learning_archive_settlement.py'
      - 'tests/test_learning_archive_settlement_women_alias.py'
      - '.github/workflows/learning-archive-settlement-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settlement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest requests python-dateutil
      - name: Compile settlement runtime
        run: python -m py_compile learning_archive/settlement.py
      - name: Run settlement regressions
        run: python -m pytest -q tests/test_learning_archive_settlement.py tests/test_learning_archive_settlement_women_alias.py
