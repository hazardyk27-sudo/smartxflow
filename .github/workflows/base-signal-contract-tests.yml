# Verify user-approved main -> preview history merge (PR #63) on exact preview source.
name: Base signal source and persistence tests (no DB)
on:
  push:
    branches: [preview]
    paths:
      - "base_signal_engine/**"
      - "tests/test_base_signal_*.py"
      - "tests/test_base_fixture_discovery_worker.py"
      - "tests/test_signal_motor_*.py"
      - "migrations/2026_10_24_signal_motor_*.sql"
      - "tests/test_base_signals_feed.py"
      - "migrations/2026_10_18_sxf_base_*.sql"
      - "migrations/2026_10_19_sxf_base_*.sql"
      - "migrations/2026_10_20_sxf_base_*.sql"
      - ".github/workflows/base-signal-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install unit-test-only dependencies
        run: python -m pip install --disable-pip-version-check "pytest==9.0.2" "requests==2.31.0"
      - name: Run Base Phase 1-4B unit and static contract suites
        run: |
          python -m pytest -q \
            tests/test_base_signal_rules.py \
            tests/test_base_signals_feed.py \
            tests/test_base_signal_reader.py \
            tests/test_base_signal_scheduler.py \
            tests/test_base_signal_storage.py \
            tests/test_base_signal_phase4a_contract.py \
            tests/test_base_signal_phase4b.py \
            tests/test_base_signal_phase4b_reconciliation.py \
            tests/test_base_signal_phase4c_provenance.py \
            tests/test_base_signal_phase4c_dispatch.py \
            tests/test_base_signal_phase4c_discovery.py \
            tests/test_base_signal_phase4c4_drift.py \
            tests/test_base_signal_phase4c4_heartbeat.py \
            tests/test_base_signal_phase4c4_discovery_heartbeat.py \
            tests/test_base_signal_phase4c4_health.py \
            tests/test_base_signal_phase4c4_projection.py \
            tests/test_base_signal_phase5a_source.py \
            tests/test_base_signal_phase5b_preflight.py \
            tests/test_base_signal_phase5c_shadow.py \
            tests/test_base_signal_phase5c_observer.py \
            tests/test_base_signal_phase5c_report.py \
            tests/test_base_signal_phase5d_release_gate.py \
            tests/test_base_signal_real_source_smoke.py \
            tests/test_base_signal_hetzner_probe.py \
            tests/test_base_signal_hetzner_worker.py \
            tests/test_base_signal_near_term_discovery.py \
            tests/test_base_fixture_discovery_worker.py \
            tests/test_base_signal_priority_lanes.py \
            tests/test_base_signal_pre_shadow.py \
            tests/test_base_signal_source_tail_probe.py \
            tests/test_signal_motor_fresh_start_20261022.py \
            tests/test_signal_motor_v3_cutover.py

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: sxf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sxf_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      SXF_TEST_DATABASE_URL: postgresql://postgres:local_test_only@127.0.0.1:5432/sxf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated PostgreSQL test driver
        run: python -m pip install --disable-pip-version-check "pytest==9.0.2" "psycopg2-binary==2.9.10"
      - name: Apply proposed migrations ONLY inside disposable CI PostgreSQL
        run: python -m pytest -q tests/test_base_signal_postgres_phase4.py tests/test_base_signal_priority_lanes_postgres.py
