name: P2 Chart Helper Split Test

on:
  push:
    branches: [perf/p2-chart-helper-split]

permissions:
  contents: write

jobs:
  chart-helper-split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-chart-helper-split
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deferred chart helper split
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          helpers = [
              'getBucketConfig',
              'formatTimeLabel',
              'createBrushSlider',
              'drawMiniChart',
              'renderChartLegendFilters',
              'filterHistoryByTimeRange',
          ]

          def find_function(text, name):
              m = re.search(r'(?<![\w$])(?:async\s+)?function\s+' + re.escape(name) + r'\s*\(', text)
              if not m:
                  return None
              start = m.start()
              brace = text.find('{', m.end())
              if brace < 0:
                  raise RuntimeError(f'{name}: opening brace not found')

              depth = 0
              i = brace
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''

                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue

                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ("'", '"', '`'):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1, text[start:i + 1]
                  i += 1
              raise RuntimeError(f'{name}: closing brace not found')

          def move_helpers(main_path, deferred_path):
              main = Path(main_path).read_text()
              deferred = Path(deferred_path).read_text()
              before = len(main.encode())
              moved = []

              for name in helpers:
                  found = find_function(main, name)
                  if found is None:
                      if find_function(deferred, name) is not None:
                          continue
                      raise RuntimeError(f'{name}: missing from both {main_path} and {deferred_path}')
                  start, end, segment = found
                  if find_function(deferred, name) is not None:
                      raise RuntimeError(f'{name}: duplicate already exists in {deferred_path}')
                  left = main[:start].rstrip()
                  right = main[end:].lstrip('\n')
                  main = left + '\n\n' + right
                  deferred = deferred.rstrip() + '\n\n' + segment.strip() + '\n'
                  moved.append(name)

              Path(main_path).write_text(main)
              Path(deferred_path).write_text(deferred)
              after = len(main.encode())
              delta = before - after
              print(f'{main_path}: {before} -> {after} ({delta} bytes removed); moved={moved}')
              return delta

          src_delta = move_helpers('static/js/app.js.src', 'static/js/modal-chart.js.src')
          runtime_delta = move_helpers('static/js/app.js', 'static/js/modal-chart.js')

          if src_delta < 7000:
              raise SystemExit(f'source bundle reduction too small: {src_delta}')
          if runtime_delta < 4500:
              raise SystemExit(f'runtime bundle reduction too small: {runtime_delta}')
          PY

      - name: JavaScript syntax and frontend regressions
        shell: bash
        run: |
          cp static/js/app.js.src /tmp/app-src.js
          cp static/js/modal-chart.js.src /tmp/modal-chart-src.js
          node --check static/js/app.js
          node --check static/js/modal-chart.js
          node --check /tmp/app-src.js
          node --check /tmp/modal-chart-src.js
          node --test tests/test_modal_chart_helper_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_modal_live_code_split.js
          node --test tests/test_app_bootstrap.js

      - name: Python regression sentinels
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest httpx
          python -m pytest -q \
            tests/test_deferred_analysis_ui.py \
            tests/test_favorites_bootstrap.py \
            tests/test_match_history_bulk_rpc.py \
            tests/test_poly_trade_checkpoint_batch.py \
            tests/test_polymarket_match_window_query.py

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name "SmartXFlow CI"
          git config user.email "smartxflow-ci@users.noreply.github.com"
          git rm .github/workflows/p2-chart-helper-split-test.yml
          git add static/js/app.js static/js/app.js.src static/js/modal-chart.js static/js/modal-chart.js.src tests/test_modal_chart_helper_split.js
          git commit -m "perf: defer modal chart helper runtime"
          git push origin HEAD:perf/p2-chart-helper-split
