name: P0 First Snapshot Test

on:
  push:
    branches: [perf/p0-first-snapshot-fetch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-first-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest requests pytz python-dateutil
      - name: Compile signal runtime
        run: |
          python -m py_compile sinyal_engine.py
          python -m py_compile sinyal_engine_runtime.py
          python -m py_compile sinyal_first_snapshot_fetch.py
      - name: Run P0 and signal runtime regressions
        run: >-
          python -m pytest -q
          tests/test_signal_first_snapshot_fetch.py
          tests/test_sinyal_engine_runtime.py
          tests/test_signal_cooldown_timestamp_encoding.py
