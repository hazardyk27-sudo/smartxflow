name: Deploy Predictor Orchestrator

on:
  workflow_run:
    workflows: ["Deploy to Hetzner"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-predictor:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Install and verify exact Predictor production SHA
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            cd /opt/smartxflow

            BRANCH="$(sudo -u smartxflow git branch --show-current)"
            HEAD="$(sudo -u smartxflow git rev-parse HEAD)"
            if [ "$BRANCH" != "main" ]; then
              echo "PREDICTOR DEPLOY STOP: production branch is '$BRANCH'"
              exit 1
            fi
            if [ "$HEAD" != "$DEPLOY_SHA" ]; then
              echo "PREDICTOR DEPLOY STOP: production HEAD $HEAD != approved deploy SHA $DEPLOY_SHA"
              exit 1
            fi
            if ! sudo -u smartxflow git diff --quiet || ! sudo -u smartxflow git diff --cached --quiet; then
              echo "PREDICTOR DEPLOY STOP: tracked production tree is dirty"
              exit 1
            fi

            # The orchestrator is localhost-only but its API still requires a
            # stable server-side bearer secret. Provision it once on the host,
            # outside the tracked source tree, without ever printing the value.
            sudo /usr/bin/install -d -m 0750 -o smartxflow -g smartxflow /var/lib/smartxflow-predictor
            SECRET_FILE=/var/lib/smartxflow-predictor/predictor-orchestrator.env
            if ! sudo /usr/bin/test -s "$SECRET_FILE"; then
              GENERATED_SECRET="$(/usr/bin/openssl rand -hex 32)"
              printf 'PREDICTOR_ORCHESTRATOR_SECRET=%s\n' "$GENERATED_SECRET" \
                | sudo /usr/bin/tee "$SECRET_FILE" >/dev/null
              unset GENERATED_SECRET
            fi
            sudo /bin/chown root:smartxflow "$SECRET_FILE"
            sudo /bin/chmod 0640 "$SECRET_FILE"
            if ! sudo /usr/bin/grep -q '^PREDICTOR_ORCHESTRATOR_SECRET=..' "$SECRET_FILE"; then
              echo "PREDICTOR DEPLOY STOP: durable orchestrator secret is missing"
              exit 1
            fi

            sudo /usr/bin/install -m 0644 \
              /opt/smartxflow/deploy/systemd/smartxflow-predictor-orchestrator.service \
              /etc/systemd/system/smartxflow-predictor-orchestrator.service
            sudo /bin/systemctl daemon-reload
            sudo /bin/systemctl enable smartxflow-predictor-orchestrator.service
            sudo /bin/systemctl restart smartxflow-predictor-orchestrator.service

            STATE=""
            HEALTH=""
            for _ in $(seq 1 90); do
              STATE="$(sudo /bin/systemctl is-active smartxflow-predictor-orchestrator.service || true)"
              if [ "$STATE" = "failed" ] || [ "$STATE" = "inactive" ]; then
                sudo /bin/journalctl -u smartxflow-predictor-orchestrator.service -n 120 --no-pager || true
                echo "PREDICTOR DEPLOY STOP: service state is '$STATE'"
                exit 1
              fi
              if [ "$STATE" = "active" ]; then
                HEALTH="$(curl -fsS --max-time 2 http://127.0.0.1:8011/healthz 2>/dev/null || true)"
                if [ -n "$HEALTH" ]; then
                  break
                fi
              fi
              sleep 2
            done
            if [ -z "$HEALTH" ]; then
              sudo /bin/journalctl -u smartxflow-predictor-orchestrator.service -n 120 --no-pager || true
              echo "PREDICTOR DEPLOY STOP: service never became HTTP-ready (state '$STATE')"
              exit 1
            fi

            python3 - "$HEALTH" <<'PY'
            import json, sys
            payload = json.loads(sys.argv[1])
            if payload.get("ok") is not True:
                raise SystemExit("Predictor healthz ok=false")
            if payload.get("stage1_source_enabled") is not True:
                raise SystemExit("Predictor Stage 1 source is disabled")
            print("PREDICTOR_HEALTH_OK")
            PY

            # Retry all durable Predictor lifecycle stores that may have been
            # created before the canonical StateDirectory path was enforced.
            # This recovers accepted Stage 3 rows without regenerating predictions.
            RETRY_OUTPUT="$(sudo -u smartxflow env \
              PYTHONPATH=/opt/smartxflow \
              PREDICTOR_STATE_DB=/var/lib/smartxflow-predictor/predictor-orchestrator.sqlite3 \
              LEARNING_ARCHIVE_GIT_SSH_KEY=/var/lib/smartxflow-prematch/github_learning_archive_ed25519 \
              /opt/smartxflow/venv/bin/python \
              /opt/smartxflow/scripts/retry_predictor_archive_pending.py \
              --dotenv /opt/smartxflow/.env \
              --db /var/lib/smartxflow-predictor/predictor-orchestrator.sqlite3 \
              --scan-root /opt/smartxflow/data \
              --scan-root /var/lib/smartxflow-predictor || true)"
            echo "$RETRY_OUTPUT"
            python3 - "$RETRY_OUTPUT" <<'PY'
            import json, sys
            payload = json.loads(sys.argv[1])
            if payload.get("ok") is not True:
                raise SystemExit(
                    f"Predictor archive retry still pending: {payload.get('remaining_pending')} stage run(s)"
                )
            print(
                "PREDICTOR_ARCHIVE_RETRY_OK "
                f"scanned_databases={payload.get('scanned_databases', 0)} "
                f"retried_stage_runs={payload.get('retried_stage_runs', 0)} "
                f"remaining_pending={payload.get('remaining_pending', 0)}"
            )
            PY

            FINAL="$(sudo -u smartxflow git rev-parse HEAD)"
            if [ "$FINAL" != "$DEPLOY_SHA" ]; then
              echo "PREDICTOR DEPLOY STOP: HEAD changed during service activation"
              exit 1
            fi
            echo "PREDICTOR_DEPLOY_OK SHA=$FINAL"
