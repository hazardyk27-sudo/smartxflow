name: Deploy Predictor Orchestrator

on:
  workflow_run:
    workflows: ["Deploy to Hetzner"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-predictor:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Install and verify exact Predictor production SHA
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            cd /opt/smartxflow

            BRANCH="$(sudo -u smartxflow git branch --show-current)"
            HEAD="$(sudo -u smartxflow git rev-parse HEAD)"
            if [ "$BRANCH" != "main" ]; then
              echo "PREDICTOR DEPLOY STOP: production branch is '$BRANCH'"
              exit 1
            fi
            if [ "$HEAD" != "$DEPLOY_SHA" ]; then
              echo "PREDICTOR DEPLOY STOP: production HEAD $HEAD != approved deploy SHA $DEPLOY_SHA"
              exit 1
            fi
            if ! sudo -u smartxflow git diff --quiet || ! sudo -u smartxflow git diff --cached --quiet; then
              echo "PREDICTOR DEPLOY STOP: tracked production tree is dirty"
              exit 1
            fi

            sudo /usr/bin/install -d -m 0750 -o smartxflow -g smartxflow /var/lib/smartxflow-predictor
            SECRET_FILE=/var/lib/smartxflow-predictor/predictor-orchestrator.env
            if ! sudo /usr/bin/test -s "$SECRET_FILE"; then
              GENERATED_SECRET="$(/usr/bin/openssl rand -hex 32)"
              printf 'PREDICTOR_ORCHESTRATOR_SECRET=%s\n' "$GENERATED_SECRET" \
                | sudo /usr/bin/tee "$SECRET_FILE" >/dev/null
              unset GENERATED_SECRET
            fi
            sudo /bin/chown root:smartxflow "$SECRET_FILE"
            sudo /bin/chmod 0640 "$SECRET_FILE"
            if ! sudo /usr/bin/grep -q '^PREDICTOR_ORCHESTRATOR_SECRET=..' "$SECRET_FILE"; then
              echo "PREDICTOR DEPLOY STOP: durable orchestrator secret is missing"
              exit 1
            fi

            sudo /usr/bin/install -m 0644 \
              /opt/smartxflow/deploy/systemd/smartxflow-predictor-orchestrator.service \
              /etc/systemd/system/smartxflow-predictor-orchestrator.service
            sudo /bin/systemctl daemon-reload
            sudo /bin/systemctl enable smartxflow-predictor-orchestrator.service
            sudo /bin/systemctl restart smartxflow-predictor-orchestrator.service

            STATE=""
            HEALTH=""
            for _ in $(seq 1 90); do
              STATE="$(sudo /bin/systemctl is-active smartxflow-predictor-orchestrator.service || true)"
              if [ "$STATE" = "failed" ] || [ "$STATE" = "inactive" ]; then
                sudo /bin/journalctl -u smartxflow-predictor-orchestrator.service -n 120 --no-pager || true
                echo "PREDICTOR DEPLOY STOP: service state is '$STATE'"
                exit 1
              fi
              if [ "$STATE" = "active" ]; then
                HEALTH="$(curl -fsS --max-time 2 http://127.0.0.1:8011/healthz 2>/dev/null || true)"
                if [ -n "$HEALTH" ]; then
                  break
                fi
              fi
              sleep 2
            done
            if [ -z "$HEALTH" ]; then
              sudo /bin/journalctl -u smartxflow-predictor-orchestrator.service -n 120 --no-pager || true
              echo "PREDICTOR DEPLOY STOP: service never became HTTP-ready (state '$STATE')"
              exit 1
            fi

            python3 - "$HEALTH" <<'PY'
            import json, sys
            payload = json.loads(sys.argv[1])
            if payload.get("ok") is not True:
                raise SystemExit("Predictor healthz ok=false")
            if payload.get("stage1_source_enabled") is not True:
                raise SystemExit("Predictor Stage 1 source is disabled")
            print("PREDICTOR_HEALTH_OK")
            PY

            RETRY_OUTPUT="$(sudo -u smartxflow env \
              PYTHONPATH=/opt/smartxflow \
              PREDICTOR_STATE_DB=/var/lib/smartxflow-predictor/predictor-orchestrator.sqlite3 \
              LEARNING_ARCHIVE_GIT_SSH_KEY=/var/lib/smartxflow-prematch/github_learning_archive_ed25519 \
              /opt/smartxflow/venv/bin/python \
              /opt/smartxflow/scripts/retry_predictor_archive_pending.py \
              --dotenv /opt/smartxflow/.env \
              --db /var/lib/smartxflow-predictor/predictor-orchestrator.sqlite3 \
              --scan-root /opt/smartxflow/data || true)"
            echo "$RETRY_OUTPUT"
            python3 - "$RETRY_OUTPUT" <<'PY'
            import json, sys
            lines = [line.strip() for line in sys.argv[1].splitlines() if line.strip().startswith('{')]
            if not lines:
                raise SystemExit('Predictor canonical retry returned no JSON receipt')
            payload = json.loads(lines[-1])
            if payload.get("ok") is not True:
                raise SystemExit(
                    f"Predictor archive retry still pending: {payload.get('remaining_pending')} stage run(s)"
                )
            print(
                "PREDICTOR_ARCHIVE_RETRY_OK "
                f"scanned_databases={payload.get('scanned_databases', 0)} "
                f"retried_stage_runs={payload.get('retried_stage_runs', 0)} "
                f"remaining_pending={payload.get('remaining_pending', 0)}"
            )
            PY

            # One-time reconciliation of the exact formal 2026-10-09 run. The
            # archive write succeeded earlier but the local lifecycle receipt write
            # failed. Reconcile from immutable durable archive truth; never rebuild
            # or overwrite the historical case package.
            TARGET_WORKFLOW='pred_20261009T134410_bef4b19b53'
            TARGET_STAGE_RUN='pred_20261009T134410_bef4b19b53:stage3:a31d6ecd09'
            LEGACY_DB='/var/lib/smartxflow-predictor/chatgpt-stage1-20261009.sqlite3'
            if ! sudo /usr/bin/test -f "$LEGACY_DB"; then
              echo "PREDICTOR LEGACY RECONCILE STOP: expected durable DB is missing"
              exit 1
            fi
            sudo /bin/chown smartxflow:smartxflow "$LEGACY_DB"
            sudo /bin/chmod 0640 "$LEGACY_DB"
            for SUFFIX in -wal -shm -journal; do
              if sudo /usr/bin/test -e "${LEGACY_DB}${SUFFIX}"; then
                sudo /bin/chown smartxflow:smartxflow "${LEGACY_DB}${SUFFIX}"
                sudo /bin/chmod 0640 "${LEGACY_DB}${SUFFIX}"
              fi
            done

            VERIFY_TMP="$(mktemp -d /tmp/sxf-learning-archive-verify.XXXXXX)"
            trap 'rm -rf "$VERIFY_TMP"' EXIT
            sudo /bin/chown smartxflow:smartxflow "$VERIFY_TMP"
            sudo -u smartxflow env \
              GIT_SSH_COMMAND="ssh -i /var/lib/smartxflow-prematch/github_learning_archive_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
              git clone --quiet --depth 1 --single-branch --branch learning-archive \
              git@github.com:hazardyk27-sudo/smartxflow.git "$VERIFY_TMP/repo"
            ARCHIVE_COMMIT="$(sudo -u smartxflow git -C "$VERIFY_TMP/repo" rev-parse HEAD)"

            RECONCILE_OUTPUT="$(sudo -u smartxflow env \
              PYTHONPATH=/opt/smartxflow \
              /opt/smartxflow/venv/bin/python \
              /opt/smartxflow/scripts/reconcile_predictor_archive_lifecycle.py \
              --db "$LEGACY_DB" \
              --workflow-id "$TARGET_WORKFLOW" \
              --stage-run-id "$TARGET_STAGE_RUN" \
              --archive-root "$VERIFY_TMP/repo/learning_archive_data" \
              --archive-commit "$ARCHIVE_COMMIT" || true)"
            echo "$RECONCILE_OUTPUT"
            python3 - "$RECONCILE_OUTPUT" "$TARGET_WORKFLOW" "$TARGET_STAGE_RUN" <<'PY'
            import json, sys
            lines = [line.strip() for line in sys.argv[1].splitlines() if line.strip().startswith('{')]
            if not lines:
                raise SystemExit('target Predictor reconciliation returned no JSON receipt')
            payload = json.loads(lines[-1])
            workflow_id, stage_run_id = sys.argv[2:]
            if payload.get('ok') is not True:
                raise SystemExit(f"target Predictor lifecycle reconcile failed: {payload.get('error')}")
            if payload.get('workflow_id') != workflow_id or payload.get('stage_run_id') != stage_run_id:
                raise SystemExit('target Predictor reconciliation identity mismatch')
            if payload.get('formal_cases') != 14:
                raise SystemExit(f"target reconciliation has {payload.get('formal_cases')} cases, expected 14")
            if payload.get('archive_status') != 'RECORDED' or payload.get('diary_status') != 'RECORDED':
                raise SystemExit('target Predictor lifecycle is not fully RECORDED')
            if len(payload.get('verified_cases') or []) != 14:
                raise SystemExit('target Predictor durable archive verification did not cover 14 cases')
            print(
                'PREDICTOR_LEGACY_RECONCILE_OK '
                f"workflow={workflow_id} stage_run={stage_run_id} cases=14 "
                f"archive_commit={payload.get('archive_commit')}"
            )
            PY

            sudo -u smartxflow python3 - "$LEGACY_DB" "$TARGET_WORKFLOW" "$TARGET_STAGE_RUN" <<'PY'
            import sqlite3, sys
            db_path, workflow_id, stage_run_id = sys.argv[1:]
            con = sqlite3.connect(f'file:{db_path}?mode=ro', uri=True)
            try:
                rows = con.execute(
                    "SELECT archive_status, COALESCE(diary_status,'') "
                    "FROM predictor_archive_lifecycle WHERE workflow_id=? AND stage_run_id=?",
                    (workflow_id, stage_run_id),
                ).fetchall()
            finally:
                con.close()
            if len(rows) != 14:
                raise SystemExit(f'target lifecycle has {len(rows)} rows, expected 14')
            if any(a != 'RECORDED' or d != 'RECORDED' for a, d in rows):
                raise SystemExit('target lifecycle still contains pending archive/diary rows')
            print(f'PREDICTOR_LEGACY_LIFECYCLE_OK stage_run={stage_run_id} cases={len(rows)}')
            PY

            FINAL="$(sudo -u smartxflow git rev-parse HEAD)"
            if [ "$FINAL" != "$DEPLOY_SHA" ]; then
              echo "PREDICTOR DEPLOY STOP: HEAD changed during service activation"
              exit 1
            fi
            echo "PREDICTOR_DEPLOY_OK SHA=$FINAL"
