name: P2 Deferred Background Live Test

on:
  push:
    branches: [perf/p2-defer-background-live-v2]

permissions:
  contents: write

jobs:
  deferred-background-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-defer-background-live-v2
          fetch-depth: 0

      - name: Defer background live startup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacement = '''function _startBackgroundLiveFetch() {
              if (_bgLiveInterval || _bgLiveStartScheduled) return;
              _bgLiveStartScheduled = true;

              function begin() {
                  if (_bgLiveInterval) return;
                  _bgLiveStartScheduled = false;
                  _fetchBackgroundLiveData();
                  _bgLiveInterval = setInterval(_fetchBackgroundLiveData, 60000);
              }

              if (typeof window.requestIdleCallback === 'function') {
                  window.requestIdleCallback(begin, { timeout: 5000 });
              } else {
                  window.setTimeout(begin, 2500);
              }
          }'''

          function_pattern = re.compile(
              r"function _startBackgroundLiveFetch\(\)\s*\{\s*"
              r"_fetchBackgroundLiveData\(\);\s*"
              r"_bgLiveInterval\s*=\s*setInterval\(_fetchBackgroundLiveData,\s*60000\);\s*\}"
          )
          interval_pattern = re.compile(r"var _bgLiveInterval\s*=\s*null;")

          for filename in ('static/js/app.js.src', 'static/js/app.js'):
              path = Path(filename)
              source = path.read_text()
              if '_bgLiveStartScheduled' in source:
                  raise SystemExit(f'{filename}: scheduling guard already exists')

              source, interval_count = interval_pattern.subn(
                  'var _bgLiveInterval = null;\nvar _bgLiveStartScheduled = false;',
                  source,
                  count=1,
              )
              if interval_count != 1:
                  raise SystemExit(f'{filename}: background interval anchor missing')

              source, function_count = function_pattern.subn(replacement, source, count=1)
              if function_count != 1:
                  raise SystemExit(f'{filename}: background live function anchor missing')
              path.write_text(source)
          PY

          cat > tests/test_deferred_background_live.js <<'JSTEST'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');
          const vm = require('node:vm');

          function extractFunction(source, signature) {
            const start = source.indexOf(signature);
            assert.ok(start >= 0, `missing ${signature}`);
            const open = source.indexOf('{', start);
            let depth = 0;
            for (let i = open; i < source.length; i += 1) {
              if (source[i] === '{') depth += 1;
              else if (source[i] === '}') {
                depth -= 1;
                if (depth === 0) return source.slice(start, i + 1);
              }
            }
            throw new Error(`unterminated ${signature}`);
          }

          for (const file of ['app.js.src', 'app.js']) {
            const source = fs.readFileSync(path.join(__dirname, '..', 'static', 'js', file), 'utf8');

            test(`background live waits for browser idle (${file})`, () => {
              const fn = extractFunction(source, 'function _startBackgroundLiveFetch()');
              let idleCallback = null;
              let fetchCount = 0;
              let intervalDelay = null;
              const context = {
                _bgLiveInterval: null,
                _bgLiveStartScheduled: false,
                _fetchBackgroundLiveData() { fetchCount += 1; },
                setInterval(callback, delay) { intervalDelay = delay; return 41; },
                window: {
                  requestIdleCallback(callback, options) {
                    assert.equal(options.timeout, 5000);
                    idleCallback = callback;
                    return 9;
                  },
                  setTimeout() { throw new Error('fallback timer should not run when requestIdleCallback exists'); }
                }
              };
              vm.runInNewContext(`${fn}\n_startBackgroundLiveFetch();`, context);
              assert.equal(fetchCount, 0, 'live request must not start synchronously during bootstrap');
              assert.equal(context._bgLiveStartScheduled, true);
              assert.equal(typeof idleCallback, 'function');

              idleCallback();
              assert.equal(fetchCount, 1);
              assert.equal(intervalDelay, 60000);
              assert.equal(context._bgLiveStartScheduled, false);
              assert.equal(context._bgLiveInterval, 41);
            });

            test(`background live uses delayed fallback without idle callback (${file})`, () => {
              const fn = extractFunction(source, 'function _startBackgroundLiveFetch()');
              let timeoutCallback = null;
              let timeoutDelay = null;
              let fetchCount = 0;
              const context = {
                _bgLiveInterval: null,
                _bgLiveStartScheduled: false,
                _fetchBackgroundLiveData() { fetchCount += 1; },
                setInterval() { return 12; },
                window: {
                  setTimeout(callback, delay) {
                    timeoutCallback = callback;
                    timeoutDelay = delay;
                    return 7;
                  }
                }
              };
              vm.runInNewContext(`${fn}\n_startBackgroundLiveFetch();`, context);
              assert.equal(fetchCount, 0);
              assert.equal(timeoutDelay, 2500);
              assert.equal(typeof timeoutCallback, 'function');

              timeoutCallback();
              assert.equal(fetchCount, 1);
              assert.equal(context._bgLiveInterval, 12);
            });
          }
          JSTEST

      - name: Run deferred background live regressions
        run: |
          node --check static/js/app.js.src
          node --check static/js/app.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_app_bootstrap.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_analysis_entrypoints.js

      - name: Commit tested implementation
        run: |
          git config user.name 'SmartXFlow CI'
          git config user.email 'smartxflow-ci@users.noreply.github.com'
          git add static/js/app.js static/js/app.js.src tests/test_deferred_background_live.js
          git rm .github/workflows/p2-deferred-background-live-test.yml
          git commit -m 'perf: defer background live fetch until idle'
          git push origin HEAD:perf/p2-defer-background-live-v2
