name: P2 Modal Live Split Test

on:
  push:
    branches: [perf/p2-modal-live-split]

permissions:
  contents: write

jobs:
  modal-live-split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-modal-live-split
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deferred modal-live split
        run: python scripts/_p2_modal_live_split_stage.py

      - name: JavaScript syntax and frontend regressions
        run: |
          cp static/js/app.js.src /tmp/app-src.js
          cp static/js/modal-live.js.src /tmp/modal-live-src.js
          cp static/js/modal-chart.js.src /tmp/modal-chart-src.js
          cp static/js/modal-alarms.js.src /tmp/modal-alarms-src.js
          node --check /tmp/app-src.js
          node --check /tmp/modal-live-src.js
          node --check /tmp/modal-chart-src.js
          node --check /tmp/modal-alarms-src.js
          node --check static/js/app.js
          node --check static/js/modal-live.js
          node --check static/js/modal-chart.js
          node --check static/js/modal-alarms.js
          node --test tests/test_modal_live_code_split.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_favorites_bootstrap.js
          node --test tests/test_alarm_identity.js
          node --test tests/test_app_bootstrap.js

      - name: Python performance and identity regressions
        run: |
          python -m pip install -q pytest httpx requests beautifulsoup4 pytz
          python -m pytest -q \
            tests/test_deferred_analysis_ui.py \
            tests/test_favorites_bootstrap.py \
            tests/test_match_history_bulk_rpc.py \
            tests/test_poly_trade_checkpoint_batch.py \
            tests/test_polymarket_match_window_query.py \
            tests/test_polymarket_events_pagination.py \
            tests/test_hash.py

      - name: Commit tested implementation
        run: |
          git config user.name 'SmartXFlow CI'
          git config user.email 'smartxflow-ci@users.noreply.github.com'
          git add static/js/app.js static/js/app.js.src static/js/modal-live.js static/js/modal-live.js.src tests/test_modal_live_code_split.js tests/test_deferred_modal_prefetch.js
          git rm .github/workflows/p2-modal-live-split-test.yml scripts/_p2_modal_live_split_stage.py
          git commit -m 'perf: defer modal live detail runtime'
          git push origin HEAD:perf/p2-modal-live-split
