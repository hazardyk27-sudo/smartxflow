name: SXF CAPITALE archive admin security checks

on:
  push:
    branches: [main, preview, 'fix/sxf-archive-token-only-replace-20261022']
    paths:
      - sxf_capitale_archive_admin.py
      - sxf_admin_password_auth.py
      - templates/admin_login.html
      - app.py
      - tests/test_sxf_admin_password_auth.py
      - scripts/configure_sxf_archive_access.py
      - tests/test_sxf_archive_configuration.py
      - templates/admin_sxf_archive.html
      - tests/test_sxf_capitale_archive_admin.py
      - .github/workflows/sxf-capitale-archive-admin-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated minimal Flask test dependency
        run: python -m pip install Flask==3.1.1
      - name: Compile new archive admin route and run no-network security tests
        run: |
          python -m py_compile sxf_capitale_archive_admin.py sxf_admin_password_auth.py
          python -m unittest discover -s tests -p 'test_sxf_*admin*.py' -v
          python -m unittest discover -s tests -p 'test_sxf_archive_configuration.py' -v
