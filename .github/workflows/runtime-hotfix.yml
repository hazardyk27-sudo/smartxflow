name: Runtime Hotfix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/runtime-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Verify branch did not move
        run: |
          set -euo pipefail
          git fetch origin preview
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/preview)" = "$GITHUB_SHA"

      - name: Apply focused runtime fixes
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, got {count}")
              return text.replace(old, new, 1)

          # Replit Preview gets a distinct scraper identity. Production keeps the
          # legacy 'replit' identity so the already-running producer is visible
          # to Preview's existing external-master fallback immediately.
          p = Path('scheduled_scraper.py')
          text = p.read_text(encoding='utf-8')
          text = one(
              text,
              'SCRAPER_SOURCE = "replit"',
              'SCRAPER_SOURCE = (\n    os.environ.get("SMARTXFLOW_SCRAPER_SOURCE")\n    or ("replit-preview" if (os.environ.get("REPL_ID") or os.environ.get("REPL_SLUG") or os.environ.get("REPL_OWNER")) else "replit")\n)',
              'scheduled scraper source identity',
          )
          p.write_text(text, encoding='utf-8')

          # Early Money Lock date fallback can legitimately have no fixture row.
          # Never dereference None; preserve the parsed fallback kickoff value.
          p = Path('sinyal_engine.py')
          text = p.read_text(encoding='utf-8')
          text = one(
              text,
              "'league': league or kickoff_info.get('league', ''),",
              "'league': league or (kickoff_info or {}).get('league', ''),",
              'EML league fallback',
          )
          text = one(
              text,
              "'kickoff_utc': kickoff_info.get('kickoff_utc', ''),",
              "'kickoff_utc': (kickoff_info or {}).get('kickoff_utc', kickoff_utc_iso),",
              'EML kickoff fallback',
          )
          p.write_text(text, encoding='utf-8')

          # Add a regression guard for the Preview source identity without
          # changing any signal-rule semantics.
          p = Path('tests/test_runtime_scraper_recovery.py')
          text = p.read_text(encoding='utf-8')
          marker = 'def test_missing_heartbeat_table_switches_to_signal_fallback(monkeypatch):\n'
          insert = '''def test_replit_runtime_uses_distinct_scraper_source(monkeypatch):\n    monkeypatch.setenv("REPL_ID", "preview-runtime")\n    mod = _load_scheduled_scraper_with_stubs(monkeypatch)\n    assert mod.SCRAPER_SOURCE == "replit-preview"\n\n\n'''
          if insert.strip() not in text:
              text = one(text, marker, insert + marker, 'runtime source test insertion')
          p.write_text(text, encoding='utf-8')

      - name: Validate
        run: |
          set -euo pipefail
          python -m py_compile scheduled_scraper.py sinyal_engine.py
          bash -n run_services.sh
          ! grep -q 'sinyal_engine_runtime.py' run_services.sh
          python -m pip install --disable-pip-version-check -q pytest httpx requests pytz
          python -m pytest -q \
            tests/test_alarm_calculator_rule_guards.py \
            tests/test_alarm_recent_incremental.py \
            tests/test_alarm_recent_part2.py \
            tests/test_alarm_recent_part3.py \
            tests/test_runtime_scraper_recovery.py \
            tests/test_sinyal_engine_runtime.py
          git diff --check

      - name: Commit hotfix to preview
        run: |
          set -euo pipefail
          git fetch origin preview
          test "$(git rev-parse origin/preview)" = "$GITHUB_SHA"
          git config user.name "SmartXFlow Runtime Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add scheduled_scraper.py sinyal_engine.py tests/test_runtime_scraper_recovery.py
          git commit -m "Separate Preview scraper and harden EML fallback"
          git push origin HEAD:preview
