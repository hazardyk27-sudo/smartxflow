name: P2.20 Live Tab Split

on:
  push:
    branches: [perf/p2-live-tab-split]
    paths:
      - '.github/workflows/p2-live-tab-split-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-live-tab-split
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax checks
        run: |
          node --check static/js/app.js
          node --check static/js/live-tab.js
      - name: Run full frontend regression
        run: |
          node --test tests/test_alarm_sidebar_code_split.js
          node --test tests/test_alarm_identity.js
          node --test tests/test_live_tab_code_split.js
          python -m pytest -q tests/test_deferred_analysis_ui.py
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_modal_entry_code_split.js
          node --test tests/test_modal_info_code_split.js
          node --test tests/test_mobile_chart_panel_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_modal_chart_helper_split.js
          node --test tests/test_chart_export_code_split.js
          node --test tests/test_sort_hotpath_debug_cleanup.js
          node --test tests/test_production_debug_log_cleanup.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_modal_live_code_split.js
          node --test tests/test_app_bootstrap.js
      - name: Diff check
        run: git diff --check
      - name: Report materialized bundle sizes
        run: wc -c static/js/app.js static/js/app.js.src static/js/live-tab.js static/js/live-tab.js.src
