name: P2 Modal Prefetch Test

on:
  push:
    branches: [perf/p2-prefetch-modal-runtimes]

permissions:
  contents: write

jobs:
  modal-prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-prefetch-modal-runtimes
          fetch-depth: 0
      - name: Apply modal runtime prefetch
        run: |
          python scripts/_p2_modal_prefetch_stage.py
          python scripts/_p2_modal_prefetch_harness_stage.py
      - name: Syntax and frontend regressions
        run: |
          cp static/js/app.js.src /tmp/app-src.js
          node --check /tmp/app-src.js
          node --check static/js/app.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_app_bootstrap.js
      - name: Commit tested implementation
        run: |
          git config user.name 'SmartXFlow CI'
          git config user.email 'smartxflow-ci@users.noreply.github.com'
          git add static/js/app.js static/js/app.js.src tests/test_deferred_modal_prefetch.js tests/test_app_bootstrap.js
          git rm .github/workflows/p2-modal-prefetch-test.yml scripts/_p2_modal_prefetch_stage.py scripts/_p2_modal_prefetch_harness_stage.py
          git commit -m 'perf: prefetch deferred modal runtimes when idle'
          git push origin HEAD:perf/p2-prefetch-modal-runtimes
