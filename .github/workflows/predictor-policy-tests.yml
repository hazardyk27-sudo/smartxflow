name: Predictor Policy Tests

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/predictor-policy-tests.yml'
      - '.github/workflows/deploy-predictor-orchestrator.yml'
      - 'deploy/systemd/smartxflow-predictor-orchestrator.service'
      - 'predictor_policy/**'
      - 'predictor_orchestrator/**'
      - 'scripts/predictor_agent_bridge.py'
      - 'tests/test_predictor_policy.py'
      - 'tests/test_predictor_runtime.py'
      - 'tests/test_predictor_orchestrator.py'
      - 'tests/test_predictor_llm_client.py'
      - 'tests/test_predictor_sxf_source.py'
      - 'tests/test_predictor_strict_boundary.py'
      - 'tests/test_predictor_archive_wrapper.py'
      - 'tests/test_predictor_deploy_contract.py'
      - 'tests/test_predictor_stage3_native_price.py'
      - 'tests/test_predictor_agent_bridge.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 1
      - name: Install predictor test dependencies
        run: |
          python -m pip install --disable-pip-version-check Flask==3.0.0 requests==2.31.0 httpx==0.28.1
      - name: Run predictor policy and orchestrator regressions
        run: |
          python -m unittest \
            tests.test_predictor_policy \
            tests.test_predictor_runtime \
            tests.test_predictor_orchestrator \
            tests.test_predictor_llm_client \
            tests.test_predictor_sxf_source \
            tests.test_predictor_strict_boundary \
            tests.test_predictor_archive_wrapper \
            tests.test_predictor_deploy_contract \
            tests.test_predictor_stage3_native_price \
            tests.test_predictor_agent_bridge
      - name: Compile predictor policy, orchestrator and bridge runtime
        run: |
          python -m py_compile \
            predictor_policy/__init__.py \
            predictor_policy/validator.py \
            predictor_policy/runtime.py \
            predictor_policy/stage_comparison.py \
            predictor_orchestrator/__init__.py \
            predictor_orchestrator/config.py \
            predictor_orchestrator/schemas.py \
            predictor_orchestrator/store.py \
            predictor_orchestrator/llm_client.py \
            predictor_orchestrator/prompts.py \
            predictor_orchestrator/renderer.py \
            predictor_orchestrator/formal_publication.py \
            predictor_orchestrator/lifecycle_store.py \
            predictor_orchestrator/archive_publisher.py \
            predictor_orchestrator/archive_wrapper.py \
            predictor_orchestrator/service.py \
            predictor_orchestrator/strict_service.py \
            predictor_orchestrator/server.py \
            predictor_orchestrator/sxf_source.py \
            predictor_orchestrator/wsgi.py \
            scripts/predictor_agent_bridge.py
