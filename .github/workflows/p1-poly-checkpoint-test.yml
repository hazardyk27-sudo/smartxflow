name: P1 Poly Checkpoint Batch Test

on:
  push:
    branches: [perf/p1-poly-checkpoint-batch]

permissions:
  contents: write

jobs:
  p1-poly-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p1-poly-checkpoint-batch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire batch checkpoint loader
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('polymarket_scraper.py')
          text = path.read_text()

          old_import = '''sys.path.insert(0, os.path.dirname(__file__))\n\nfrom services.polymarket_client import (\n'''
          new_import = '''sys.path.insert(0, os.path.dirname(__file__))\n\nfrom poly_trade_checkpoints import fetch_latest_trade_checkpoints\nfrom services.polymarket_client import (\n'''
          if old_import not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_method_anchor = '''        except Exception as e:\n            log(f"[Checkpoint GET] Hata: {e}")\n            return None\n\n    def upsert_trades(self, rows: List[Dict[str, Any]]) -> bool:\n'''
          new_method_anchor = '''        except Exception as e:\n            log(f"[Checkpoint GET] Hata: {e}")\n            return None\n\n    def get_last_traded_at_many(\n        self,\n        condition_ids: List[str],\n    ) -> Dict[str, Optional[int]]:\n        return fetch_latest_trade_checkpoints(\n            self,\n            condition_ids,\n            log=log,\n            ssl_verify=SSL_VERIFY,\n        )\n\n    def upsert_trades(self, rows: List[Dict[str, Any]]) -> bool:\n'''
          if old_method_anchor not in text:
              raise SystemExit('writer method anchor not found')
          text = text.replace(old_method_anchor, new_method_anchor, 1)

          old_loop = '''    total_new = 0\n    for market_type, condition_id, market in specs:\n        raw_label = market.get("groupItemTitle") or market.get("question") or ""\n        since_ts = writer.get_last_traded_at(condition_id)\n'''
          new_loop = '''    checkpoint_by_condition = writer.get_last_traded_at_many(\n        [condition_id for _market_type, condition_id, _market in specs]\n    )\n\n    total_new = 0\n    for market_type, condition_id, market in specs:\n        raw_label = market.get("groupItemTitle") or market.get("question") or ""\n        since_ts = checkpoint_by_condition.get(condition_id)\n'''
          if old_loop not in text:
              raise SystemExit('process_match checkpoint loop anchor not found')
          text = text.replace(old_loop, new_loop, 1)

          path.write_text(text)
          PY
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests certifi python-dateutil
      - name: Compile and run P1 regressions
        run: |
          python -m py_compile polymarket_scraper.py poly_trade_checkpoints.py
          python -m pytest -q tests/test_poly_trade_checkpoint_batch.py tests/test_polymarket_events_pagination.py
      - name: Commit tested P1 implementation
        run: |
          git config user.name 'SmartXFlow CI'
          git config user.email 'smartxflow-ci@users.noreply.github.com'
          git add polymarket_scraper.py
          git rm .github/workflows/p1-poly-checkpoint-test.yml
          git commit -m 'perf: batch Polymarket trade checkpoints per match'
          git push origin HEAD:perf/p1-poly-checkpoint-batch
