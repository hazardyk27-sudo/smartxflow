name: Deferred Analysis Entrypoints Hotfix Test

on:
  push:
    branches: [hotfix/deferred-analysis-entrypoints]

permissions:
  contents: write

jobs:
  deferred-analysis-entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/deferred-analysis-entrypoints
          fetch-depth: 0
      - name: Patch all dashboard analysis entrypoints
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ('static/js/app.js', 'static/js/app.js.src'):
              path = Path(filename)
              text = path.read_text()
              count = text.count('openTrendsModal(')
              if count != 2:
                  raise SystemExit(f'{filename}: expected exactly 2 direct openTrendsModal calls, found {count}')
              text = text.replace('openTrendsModal(', 'openDeferredTrendsModal(')
              path.write_text(text)
          PY

          cat > tests/test_deferred_analysis_entrypoints.js <<'JSTEST'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');

          const bundles = [
            ['runtime', fs.readFileSync(path.join(__dirname, '..', 'static', 'js', 'app.js'), 'utf8')],
            ['source', fs.readFileSync(path.join(__dirname, '..', 'static', 'js', 'app.js.src'), 'utf8')],
          ];

          for (const [name, source] of bundles) {
            test(`dashboard analysis entrypoints use lazy loader (${name})`, () => {
              assert.equal((source.match(/openTrendsModal\(/g) || []).length, 0);
              assert.ok((source.match(/openDeferredTrendsModal\(/g) || []).length >= 2);
              assert.match(source, /function getAnalysisStarHtml\(/);
              assert.match(source, /function _testGuardAnalysis\(/);
            });
          }
          JSTEST
      - name: Run hotfix regressions
        run: |
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_app_bootstrap.js
      - name: Commit tested hotfix
        run: |
          git config user.name 'SmartXFlow CI'
          git config user.email 'smartxflow-ci@users.noreply.github.com'
          git add static/js/app.js static/js/app.js.src tests/test_deferred_analysis_entrypoints.js
          git rm .github/workflows/deferred-analysis-entrypoints-test.yml
          git commit -m 'fix: route analysis actions through lazy UI loader'
          git push origin HEAD:hotfix/deferred-analysis-entrypoints
