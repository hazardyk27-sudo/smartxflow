name: Favorites Performance Tests

on:
  push:
    branches: [preview]
    paths:
      - 'app.py'
      - 'services/supabase_client.py'
      - 'static/js/app.js'
      - 'static/js/app.js.src'
      - 'tests/test_favorites_bootstrap.py'
      - 'tests/test_favorites_bootstrap.js'
      - 'tests/test_app_bootstrap.js'
      - '.github/workflows/favorites-performance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  favorites-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest httpx requests certifi pytz flask python-dateutil
      - name: Compile runtime
        run: python -m py_compile app.py services/supabase_client.py
      - name: Run favorites performance regressions
        run: |
          python -m pytest -q tests/test_favorites_bootstrap.py
          node --test tests/test_favorites_bootstrap.js
          node --test tests/test_app_bootstrap.js
