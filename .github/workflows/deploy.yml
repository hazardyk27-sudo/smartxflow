name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact main SHA via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEPLOY_SHA,GH_TOKEN
          script: |
            set -euo pipefail

            git config --global --add safe.directory /opt/smartxflow
            cd /opt/smartxflow

            BRANCH="$(sudo -u smartxflow git branch --show-current)"
            CURRENT="$(sudo -u smartxflow git rev-parse HEAD)"

            if [ "$BRANCH" != "main" ]; then
              echo "DEPLOY STOP: production branch is '$BRANCH', expected 'main'"
              exit 1
            fi

            if ! sudo -u smartxflow git diff --quiet || ! sudo -u smartxflow git diff --cached --quiet; then
              echo "DEPLOY STOP: tracked production worktree is dirty"
              sudo -u smartxflow git status --short
              exit 1
            fi

            sudo -u smartxflow git fetch origin main
            TARGET="$(sudo -u smartxflow git rev-parse origin/main)"

            if [ "$TARGET" != "$DEPLOY_SHA" ]; then
              echo "DEPLOY STOP: origin/main ($TARGET) != requested GitHub SHA ($DEPLOY_SHA)"
              exit 1
            fi

            if [ "$CURRENT" != "$TARGET" ]; then
              if ! sudo -u smartxflow git merge-base --is-ancestor "$CURRENT" "$TARGET"; then
                echo "DEPLOY STOP: Hetzner HEAD $CURRENT is not an ancestor of target $TARGET"
                exit 1
              fi
              sudo -u smartxflow git merge --ff-only origin/main
            fi

            FINAL="$(sudo -u smartxflow git rev-parse HEAD)"
            if [ "$FINAL" != "$DEPLOY_SHA" ]; then
              echo "DEPLOY STOP: final HEAD $FINAL != requested SHA $DEPLOY_SHA"
              exit 1
            fi

            if ! sudo -u smartxflow git diff --quiet || ! sudo -u smartxflow git diff --cached --quiet; then
              echo "DEPLOY STOP: tracked tree became dirty after fast-forward"
              sudo -u smartxflow git status --short
              exit 1
            fi

            # Preserve the existing production .env and runtime data. No migrations or destructive data actions here.
            grep -v '^lxml' /opt/smartxflow/requirements.txt > /tmp/req_nolxml.txt
            chown smartxflow:smartxflow /tmp/req_nolxml.txt
            sudo -u smartxflow /opt/smartxflow/venv/bin/pip install -r /tmp/req_nolxml.txt -q
            rm -f /tmp/req_nolxml.txt

            chmod -R o+rx /opt/smartxflow/static/

            # Install the exact tracked runtime units before any restart. The helper
            # performs only explicit least-privilege install/daemon-reload/enable calls.
            /bin/bash /opt/smartxflow/deploy/sync_runtime_units.sh

            sudo /bin/systemctl enable --now smartxflow-learning-archive-prematch.timer
            sudo /bin/systemctl enable --now smartxflow-learning-archive-postmatch.timer

            if ! sudo /bin/systemctl start smartxflow-learning-archive-prematch.service; then
              echo "DEPLOY STOP: prematch service manual verification failed"
              sudo /bin/systemctl status smartxflow-learning-archive-prematch.timer --no-pager || true
              sudo /bin/systemctl status smartxflow-learning-archive-prematch.service --no-pager || true
              sudo /bin/journalctl -u smartxflow-learning-archive-prematch.service -n 50 --no-pager || true
              exit 1
            fi

            PRE_TIMER_ENABLED="$(sudo /bin/systemctl is-enabled smartxflow-learning-archive-prematch.timer)"
            PRE_TIMER_ACTIVE="$(sudo /bin/systemctl is-active smartxflow-learning-archive-prematch.timer)"
            PRE_SERVICE_RESULT="$(sudo /bin/systemctl show -p Result --value smartxflow-learning-archive-prematch.service)"
            if [ "$PRE_TIMER_ENABLED" != "enabled" ] || [ "$PRE_TIMER_ACTIVE" != "active" ] || [ "$PRE_SERVICE_RESULT" != "success" ]; then
              echo "DEPLOY STOP: prematch systemd automation verification failed"
              exit 1
            fi
            echo "PREMATCH_SYSTEMD_OK enabled=$PRE_TIMER_ENABLED active=$PRE_TIMER_ACTIVE service_result=$PRE_SERVICE_RESULT"

            if ! sudo /bin/systemctl start smartxflow-learning-archive-postmatch.service; then
              echo "DEPLOY STOP: postmatch service manual verification failed"
              sudo /bin/systemctl status smartxflow-learning-archive-postmatch.timer --no-pager || true
              sudo /bin/systemctl status smartxflow-learning-archive-postmatch.service --no-pager || true
              sudo /bin/journalctl -u smartxflow-learning-archive-postmatch.service -n 100 --no-pager || true
              exit 1
            fi

            POST_TIMER_ENABLED="$(sudo /bin/systemctl is-enabled smartxflow-learning-archive-postmatch.timer)"
            POST_TIMER_ACTIVE="$(sudo /bin/systemctl is-active smartxflow-learning-archive-postmatch.timer)"
            POST_SERVICE_RESULT="$(sudo /bin/systemctl show -p Result --value smartxflow-learning-archive-postmatch.service)"
            if [ "$POST_TIMER_ENABLED" != "enabled" ] || [ "$POST_TIMER_ACTIVE" != "active" ] || [ "$POST_SERVICE_RESULT" != "success" ]; then
              echo "DEPLOY STOP: postmatch systemd automation verification failed"
              sudo /bin/systemctl status smartxflow-learning-archive-postmatch.timer --no-pager || true
              sudo /bin/systemctl status smartxflow-learning-archive-postmatch.service --no-pager || true
              sudo /bin/journalctl -u smartxflow-learning-archive-postmatch.service -n 100 --no-pager || true
              exit 1
            fi
            echo "POSTMATCH_SYSTEMD_OK enabled=$POST_TIMER_ENABLED active=$POST_TIMER_ACTIVE service_result=$POST_SERVICE_RESULT"
            sudo /bin/systemctl list-timers smartxflow-learning-archive-prematch.timer smartxflow-learning-archive-postmatch.timer --no-pager

            # Deployment itself is a second independent prematch drain opportunity.
            sudo -u smartxflow env \
              PYTHONPATH=/opt/smartxflow \
              GITHUB_TOKEN="$GH_TOKEN" \
              GH_TOKEN="$GH_TOKEN" \
              /opt/smartxflow/venv/bin/python \
              /opt/smartxflow/scripts/drain_due_learning_revisit_queue.py \
              --dotenv /opt/smartxflow/.env

            sudo /bin/systemctl restart smartxflow-web
            sudo /bin/systemctl restart smartxflow-scraper
            sudo /bin/systemctl restart smartxflow-alarm
            sudo /bin/systemctl restart smartxflow-sinyal
            sudo /bin/systemctl restart smartxflow-live
            sudo /bin/systemctl restart smartxflow-poly
            sudo /bin/systemctl restart smartxflow-predictor-orchestrator

            # Refresh the permanent Base process on later code releases,
            # but never resurrect a stopped/failed safety-fenced worker.
            if sudo /bin/systemctl is-enabled --quiet smartxflow-base-worker.service; then
              if sudo /bin/systemctl is-active --quiet smartxflow-base-worker.service; then
                sudo /bin/systemctl restart smartxflow-base-worker.service
                sleep 3
                sudo /bin/systemctl is-active --quiet smartxflow-base-worker.service || {
                  echo "DEPLOY STOP: autonomous Base worker restart failed"
                  exit 1
                }
                echo "AUTONOMOUS_BASE_RELEASE_REFRESHED"
              else
                echo "AUTONOMOUS_BASE_OPERATOR_REVIEW: enabled but stopped; not auto-restarting"
              fi
            fi

            sleep 4
            sudo /bin/systemctl is-active smartxflow-web     || { echo "web baslamadi!"; exit 1; }
            sudo /bin/systemctl is-active smartxflow-scraper || { echo "scraper baslamadi!"; exit 1; }
            sudo /bin/systemctl is-active smartxflow-alarm   || { echo "alarm baslamadi!"; exit 1; }
            sudo /bin/systemctl is-active smartxflow-sinyal  || { echo "sinyal baslamadi!"; exit 1; }
            sudo /bin/systemctl is-active smartxflow-live    || { echo "live baslamadi!"; exit 1; }
            sudo /bin/systemctl is-active smartxflow-poly    || { echo "poly baslamadi!"; exit 1; }
            sudo /bin/systemctl is-active smartxflow-predictor-orchestrator || { echo "predictor orchestrator baslamadi!"; exit 1; }

            for unit in \
              smartxflow-web.service \
              smartxflow-scraper.service \
              smartxflow-alarm.service \
              smartxflow-sinyal.service \
              smartxflow-live.service \
              smartxflow-poly.service \
              smartxflow-predictor-orchestrator.service; do
              ENABLED="$(sudo /bin/systemctl is-enabled "$unit")"
              if [ "$ENABLED" != "enabled" ]; then
                echo "DEPLOY STOP: $unit is not enabled at boot ($ENABLED)"
                exit 1
              fi
            done

            WEB_ENV="$(sudo /bin/systemctl show -p Environment --value smartxflow-web.service)"
            case "$WEB_ENV" in
              *SMARTXFLOW_MODE=server*DISABLE_SCRAPER=true*|*DISABLE_SCRAPER=true*SMARTXFLOW_MODE=server*) ;;
              *)
                echo "DEPLOY STOP: smartxflow-web missing server/ui-only environment contract"
                echo "Environment=$WEB_ENV"
                exit 1
                ;;
            esac

            SCRAPER_EXEC="$(sudo /bin/systemctl show -p ExecStart --value smartxflow-scraper.service)"
            case "$SCRAPER_EXEC" in
              *prematch_authoritative_runtime.py*) ;;
              *)
                echo "DEPLOY STOP: smartxflow-scraper is not using prematch_authoritative_runtime.py"
                echo "ExecStart=$SCRAPER_EXEC"
                exit 1
                ;;
            esac

            ALARM_EXEC="$(sudo /bin/systemctl show -p ExecStart --value smartxflow-alarm.service)"
            case "$ALARM_EXEC" in
              *alarm_engine.py*) ;;
              *) echo "DEPLOY STOP: smartxflow-alarm wrong ExecStart=$ALARM_EXEC"; exit 1 ;;
            esac

            LIVE_EXEC="$(sudo /bin/systemctl show -p ExecStart --value smartxflow-live.service)"
            case "$LIVE_EXEC" in
              *live_scraper.py*) ;;
              *) echo "DEPLOY STOP: smartxflow-live wrong ExecStart=$LIVE_EXEC"; exit 1 ;;
            esac

            POLY_EXEC="$(sudo /bin/systemctl show -p ExecStart --value smartxflow-poly.service)"
            case "$POLY_EXEC" in
              *polymarket_scraper.py*) ;;
              *) echo "DEPLOY STOP: smartxflow-poly wrong ExecStart=$POLY_EXEC"; exit 1 ;;
            esac

            SINYAL_EXEC="$(sudo /bin/systemctl show -p ExecStart --value smartxflow-sinyal.service)"
            case "$SINYAL_EXEC" in
              *sinyal_engine_runtime.py*) ;;
              *)
                echo "DEPLOY STOP: smartxflow-sinyal is not using sinyal_engine_runtime.py"
                echo "ExecStart=$SINYAL_EXEC"
                exit 1
                ;;
            esac

            PREDICTOR_EXEC="$(sudo /bin/systemctl show -p ExecStart --value smartxflow-predictor-orchestrator.service)"
            case "$PREDICTOR_EXEC" in
              *predictor_orchestrator.wsgi:app*) ;;
              *)
                echo "DEPLOY STOP: smartxflow-predictor-orchestrator wrong ExecStart=$PREDICTOR_EXEC"
                exit 1
                ;;
            esac

            FINAL_AFTER_RESTART="$(sudo -u smartxflow git rev-parse HEAD)"
            if [ "$FINAL_AFTER_RESTART" != "$DEPLOY_SHA" ]; then
              echo "DEPLOY STOP: HEAD changed during deploy"
              exit 1
            fi
            if ! sudo -u smartxflow git diff --quiet || ! sudo -u smartxflow git diff --cached --quiet; then
              echo "DEPLOY STOP: tracked tree dirty after service restart"
              sudo -u smartxflow git status --short
              exit 1
            fi

            echo "DEPLOY_OK SHA=$FINAL_AFTER_RESTART"