name: Learning Archive Postmatch Run

on:
  push:
    branches:
      - preview
    paths:
      - 'learning_archive_postmatch_trigger/*.json'

permissions:
  contents: write

concurrency:
  group: learning-archive-postmatch-run
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4

      - name: Test settlement parser
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_learning_archive_settlement
          SETTLEMENT_B64="$(base64 -w0 learning_archive/settlement.py)"
          echo "SETTLEMENT_B64=$SETTLEMENT_B64" >> "$GITHUB_ENV"

      - name: Run canonical postmatch finalizer on production runtime
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          SETTLEMENT_B64: ${{ env.SETTLEMENT_B64 }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GH_TOKEN,SETTLEMENT_B64
          script: |
            set -euo pipefail
            cd /opt/smartxflow

            BRANCH="$(git branch --show-current)"
            if [ "$BRANCH" != "main" ]; then
              echo "POSTMATCH_STOP: production runtime branch is '$BRANCH', expected main"
              exit 1
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "POSTMATCH_STOP: tracked production worktree is dirty"
              git status --short
              exit 1
            fi

            TMP_OVERLAY="$(mktemp -d /tmp/sxf-postmatch-overlay.XXXXXX)"
            cleanup() { rm -rf "$TMP_OVERLAY"; }
            trap cleanup EXIT
            cp -a /opt/smartxflow/learning_archive "$TMP_OVERLAY/learning_archive"
            printf '%s' "$SETTLEMENT_B64" | base64 -d > "$TMP_OVERLAY/learning_archive/settlement.py"

            export PYTHONPATH="$TMP_OVERLAY:/opt/smartxflow"
            export GITHUB_TOKEN="$GH_TOKEN"
            /opt/smartxflow/venv/bin/python scripts/settle_due_learning_cases_fast.py \
              --root /opt/smartxflow \
              --queue-file /var/lib/smartxflow-postmatch/settlements.json \
              --dotenv /opt/smartxflow/.env \
              --minimum-minutes-after-kickoff 75
