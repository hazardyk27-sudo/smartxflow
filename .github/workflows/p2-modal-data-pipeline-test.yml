name: P2.18 Modal Data Pipeline Split

on:
  push:
    branches: [perf/p2-modal-data-pipeline-split]
    paths:
      - 'scripts/_p2_modal_data_pipeline_stage.py'
      - 'scripts/_p2_modal_data_pipeline_compat.py'
      - 'tests/test_modal_info_code_split.js'
      - '.github/workflows/p2-modal-data-pipeline-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-modal-data-pipeline-split
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install staging dependencies
        run: python -m pip install --disable-pip-version-check rjsmin pytest httpx pytz
      - name: Stage P2.18 split
        run: |
          python scripts/_p2_modal_data_pipeline_compat.py
          python scripts/_p2_modal_data_pipeline_stage.py
          python scripts/_p2_modal_data_pipeline_compat.py
      - name: Syntax checks
        run: |
          node --check static/js/app.js
          node --check static/js/modal-entry.js
      - name: Test modal data pipeline split
        run: node --test tests/test_modal_data_pipeline_split.js
      - name: Test modal entry split
        run: node --test tests/test_modal_entry_code_split.js
      - name: Test deferred chart libs
        run: node --test tests/test_deferred_chart_libs.js
      - name: Test modal info split
        run: node --test tests/test_modal_info_code_split.js
      - name: Test chart export split
        run: node --test tests/test_chart_export_code_split.js
      - name: Test modal chart split
        run: node --test tests/test_modal_chart_code_split.js
      - name: Test modal chart helper split
        run: node --test tests/test_modal_chart_helper_split.js
      - name: Test modal alarm split
        run: node --test tests/test_modal_alarm_code_split.js
      - name: Test modal live split
        run: node --test tests/test_modal_live_code_split.js
      - name: Test mobile chart panel split
        run: node --test tests/test_mobile_chart_panel_split.js
      - name: Test deferred modal prefetch
        run: node --test tests/test_deferred_modal_prefetch.js
      - name: Test deferred background live
        run: node --test tests/test_deferred_background_live.js
      - name: Test deferred finished scores
        run: node --test tests/test_deferred_finished_scores.js
      - name: Test deferred analysis entrypoints
        run: node --test tests/test_deferred_analysis_entrypoints.js
      - name: Test favorites bootstrap
        run: node --test tests/test_favorites_bootstrap.js
      - name: Test alarm identity
        run: node --test tests/test_alarm_identity.js
      - name: Test app bootstrap
        run: node --test tests/test_app_bootstrap.js
      - name: Test sort hotpath cleanup
        run: node --test tests/test_sort_hotpath_debug_cleanup.js
      - name: Test production debug cleanup
        run: node --test tests/test_production_debug_log_cleanup.js
      - name: Run Python regressions
        run: |
          python -m pytest -q tests/test_deferred_analysis_ui.py
          python -m pytest -q tests/test_favorites_bootstrap.py
          python -m pytest -q tests/test_hash.py
      - name: Diff check
        run: git diff --check
      - name: Commit tested product output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/js/app.js static/js/app.js.src static/js/modal-entry.js static/js/modal-entry.js.src tests/test_modal_entry_code_split.js tests/test_modal_data_pipeline_split.js tests/test_modal_info_code_split.js
          if git diff --cached --quiet; then
            echo 'No staged product changes'
            exit 1
          fi
          git commit -m 'perf: defer modal data pipeline runtime'
          git push origin HEAD:perf/p2-modal-data-pipeline-split