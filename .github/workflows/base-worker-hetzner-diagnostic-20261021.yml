name: Read-only Hetzner Base worker diagnostic 2026-10-21

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/base-worker-hetzner-diagnostic-20261021.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  base-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect permanent worker without restarting or changing state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            test "$(hostname)" = smartxflow
            echo "DIAGNOSTIC_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "PRODUCTION_SHA=$(git -C /opt/smartxflow rev-parse HEAD)"
            echo "BASE_WORKER_ENABLED=$(systemctl is-enabled smartxflow-base-worker.service || true)"
            echo "BASE_WORKER_ACTIVE=$(systemctl is-active smartxflow-base-worker.service || true)"
            systemctl show smartxflow-base-worker.service -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts -p MainPID -p ActiveEnterTimestamp -p InactiveEnterTimestamp --no-pager
            echo "BASE_PROCESS_DIAGNOSTIC"
            systemctl show smartxflow-base-worker.service -p ExecMainStartTimestamp -p MemoryCurrent -p TasksCurrent -p CPUUsageNSec --no-pager
            pid="$(systemctl show smartxflow-base-worker.service -p MainPID --value)"
            if [ "$pid" -gt 0 ]; then ps -o pid,etime,stat,wchan:28,%cpu,%mem,comm -p "$pid" || true; fi
            echo "SCRAPER_SERVICE_ACTIVE=$(systemctl is-active smartxflow-scraper.service || true)"
            echo "LEGACY_SIGNAL_ACTIVE=$(systemctl is-active smartxflow-sinyal.service || true)"
            echo "BASE_JOURNAL_LAST_45"
            journalctl -u smartxflow-base-worker.service -n 45 --no-pager -o cat | tail -n 45
            echo "BASE_DIAGNOSTIC_END"

  publish-diagnostic:
    name: Publish sanitized worker status
    needs: base-health
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record redacted diagnostic in GitHub preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | contains("base-health")) | .id' | head -1)"
          test -n "$id"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" > /tmp/base-worker-diagnostic-raw.txt
          grep -E '(DIAGNOSTIC_UTC=|PRODUCTION_SHA=|BASE_WORKER_ENABLED=|BASE_WORKER_ACTIVE=|BASE_DIAGNOSTIC_END|ActiveState=|SubState=|Result=|ExecMainStatus=|NRestarts=|MainPID=|ActiveEnterTimestamp=|InactiveEnterTimestamp=|ExecMainStartTimestamp=|MemoryCurrent=|TasksCurrent=|CPUUsageNSec=|SCRAPER_SERVICE_ACTIVE=|LEGACY_SIGNAL_ACTIVE=||HETZNER_BASE_DURABLE|UNCERTAIN)' /tmp/base-worker-diagnostic-raw.txt | tail -n 45 > /tmp/base-worker-diagnostic-sanitized.txt || true
          test -s /tmp/base-worker-diagnostic-sanitized.txt
          CONTENT="$(base64 -w0 /tmp/base-worker-diagnostic-sanitized.txt)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/docs/BASE_WORKER_READONLY_DIAGNOSTIC_20261021.txt" -f message="ops: publish sanitized Hetzner Base state (read-only diagnosis)" -f branch=preview -f content="$CONTENT" --jq '.commit.sha'
