name: Read-only Hetzner Base worker diagnostic 2026-10-21 (Moneyway source handoff)
# Re-run for queue-first worker restart failure on 2026-10-24; no remote mutations.

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/base-worker-hetzner-diagnostic-20261021.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  base-health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect permanent worker without restarting or changing state
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            test "$(hostname)" = smartxflow
            echo "DIAGNOSTIC_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "PRODUCTION_SHA=$(git -C /opt/smartxflow rev-parse HEAD)"
            echo "BASE_WORKER_ENABLED=$(systemctl is-enabled smartxflow-base-worker.service || true)"
            echo "BASE_WORKER_ACTIVE=$(systemctl is-active smartxflow-base-worker.service || true)"
            systemctl show smartxflow-base-worker.service -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts -p MainPID -p ActiveEnterTimestamp -p InactiveEnterTimestamp --no-pager
            echo "BASE_PROCESS_DIAGNOSTIC"
            systemctl show smartxflow-base-worker.service -p ExecMainStartTimestamp -p MemoryCurrent -p TasksCurrent -p CPUUsageNSec --no-pager
            pid="$(systemctl show smartxflow-base-worker.service -p MainPID --value)"
            if [ "$pid" -gt 0 ]; then ps -o pid,etime,stat,wchan:28,%cpu,%mem,comm -p "$pid" || true; fi
            echo "SCRAPER_SERVICE_ACTIVE=$(systemctl is-active smartxflow-scraper.service || true)"
            echo "RECOVERY_TIMER_ACTIVE=$(systemctl is-active smartxflow-base-guarded-recovery.timer || true)"
            echo "RECOVERY_TIMER_ENABLED=$(systemctl is-enabled smartxflow-base-guarded-recovery.timer || true)"
            echo "DISCOVERY_SERVICE_ACTIVE=$(systemctl is-active smartxflow-base-fixture-discovery.service || true)"
            echo "DISCOVERY_SERVICE_ENABLED=$(systemctl is-enabled smartxflow-base-fixture-discovery.service || true)"
            echo "LEGACY_SIGNAL_ENABLED=$(systemctl is-enabled smartxflow-sinyal.service || true)"
            echo "DISCOVERY_SERVICE_EXIT=$(systemctl show smartxflow-base-fixture-discovery.service -p ExecMainStatus --value)"
            echo "DISCOVERY_SERVICE_RESULT=$(systemctl show smartxflow-base-fixture-discovery.service -p Result --value)"
            echo "DISCOVERY_JOURNAL_LAST_8"
            journalctl -u smartxflow-base-fixture-discovery.service -n 100 --no-pager -o cat | grep -E 'BASE_FIXTURE_DISCOVERY|Main process exited|Failed with result|Traceback|ERROR|STOP|DENIED' | tail -n 8 | cut -c1-480 || true
            echo "GUARD_RECENT_DECISIONS"
            journalctl -u smartxflow-base-guarded-recovery.service --since '-75 minutes' --no-pager -o cat | grep '"mode": "BASE_GUARDED_RECOVERY"' | tail -n 10 || true
            echo "LEGACY_SIGNAL_ACTIVE=$(systemctl is-active smartxflow-sinyal.service || true)"
            echo "BASE_PROCESS_THREADS"
            pid="$(systemctl show smartxflow-base-worker.service -p MainPID --value)"
            if [ "$pid" -gt 0 ]; then ps -L -o pid,tid,etime,stat,wchan:32,comm -p "$pid" | head -n 12 || true; fi
            echo "BASE_JOURNAL_LAST_5"
            journalctl -u smartxflow-base-worker.service -n 120 --no-pager -o cat | grep -E 'Main process exited|Failed with result|Deactivated successfully|HETZNER_BASE_DURABLE' | tail -n 5 | cut -c1-400 || true
            echo "BASE_DIAG_FINAL_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "BASE_DIAG_FINAL_SHA=$(git -C /opt/smartxflow rev-parse HEAD)"
            echo "BASE_DIAG_FINAL_STATE=$(systemctl is-active smartxflow-base-worker.service || true)"
            echo "BASE_DIAG_FINAL_WATCHDOG=$(systemctl show smartxflow-base-worker.service -p WatchdogUSec --value)"
            echo "BASE_DIAGNOSTIC_END"

  publish-diagnostic:
    name: Publish sanitized worker status
    needs: base-health
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record redacted diagnostic in GitHub preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | contains("base-health")) | .id' | head -1)"
          test -n "$id"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" > /tmp/base-worker-diagnostic-raw.txt
          grep -E '(DIAGNOSTIC_UTC=|PRODUCTION_SHA=|BASE_WORKER_ENABLED=|BASE_WORKER_ACTIVE=|BASE_DIAGNOSTIC_END|BASE_DIAG_FINAL_|ActiveState=|SubState=|Result=|ExecMainStatus=|NRestarts=|MainPID=|ActiveEnterTimestamp=|InactiveEnterTimestamp=|ExecMainStartTimestamp=|MemoryCurrent=|TasksCurrent=|CPUUsageNSec=|SCRAPER_SERVICE_ACTIVE=|LEGACY_SIGNAL_ACTIVE=|LEGACY_SIGNAL_ENABLED=|RECOVERY_TIMER_ACTIVE=|RECOVERY_TIMER_ENABLED=|DISCOVERY_SERVICE_ACTIVE=|DISCOVERY_SERVICE_ENABLED=|DISCOVERY_SERVICE_EXIT=|DISCOVERY_SERVICE_RESULT=|BASE_GUARDED_RECOVERY|BASE_FIXTURE_DISCOVERY|DISCOVERY_JOURNAL|HETZNER_BASE_DURABLE|UNCERTAIN)' /tmp/base-worker-diagnostic-raw.txt | tail -n 55 > /tmp/base-worker-diagnostic-sanitized.txt || true
          test -s /tmp/base-worker-diagnostic-sanitized.txt
          CONTENT="$(base64 -w0 /tmp/base-worker-diagnostic-sanitized.txt)"
          DEST="repos/$GITHUB_REPOSITORY/contents/docs/BASE_WORKER_READONLY_DIAGNOSTIC_20261021.txt"
          EXISTING_SHA="$(gh api "$DEST?ref=preview" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api -X PUT "$DEST" -f message="ops: refresh sanitized Hetzner Base state (read-only diagnosis)" -f branch=preview -f content="$CONTENT" -f sha="$EXISTING_SHA" --jq '.commit.sha'
          else
            gh api -X PUT "$DEST" -f message="ops: refresh sanitized Hetzner Base state (read-only diagnosis)" -f branch=preview -f content="$CONTENT" --jq '.commit.sha'
          fi
