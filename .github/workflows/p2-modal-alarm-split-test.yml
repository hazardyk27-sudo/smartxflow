name: P2 Modal Alarm Split Test

on:
  push:
    branches: [perf/p2-modal-alarm-detail-split]

permissions:
  contents: write

jobs:
  modal-alarm-split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-modal-alarm-detail-split
          fetch-depth: 0
      - name: Apply deferred modal alarm split
        run: python scripts/_p2_modal_alarm_split_stage.py
      - name: Syntax and frontend regressions
        run: |
          cp static/js/app.js.src /tmp/app-src.js
          cp static/js/modal-alarms.js.src /tmp/modal-alarms-src.js
          cp static/js/modal-chart.js.src /tmp/modal-chart-src.js
          node --check /tmp/app-src.js
          node --check /tmp/modal-alarms-src.js
          node --check /tmp/modal-chart-src.js
          node --check static/js/app.js
          node --check static/js/modal-alarms.js
          node --check static/js/modal-chart.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_app_bootstrap.js
      - name: Commit tested implementation
        run: |
          git config user.name 'SmartXFlow CI'
          git config user.email 'smartxflow-ci@users.noreply.github.com'
          git add static/js/app.js static/js/app.js.src static/js/modal-alarms.js static/js/modal-alarms.js.src tests/test_modal_alarm_code_split.js
          git rm .github/workflows/p2-modal-alarm-split-test.yml scripts/_p2_modal_alarm_split_stage.py
          git commit -m 'perf: defer modal alarm detail renderer'
          git push origin HEAD:perf/p2-modal-alarm-detail-split
