name: Analizler V4 Responsive Chromium Smoke
on:
  push:
    branches: [preview]
    paths:
      - 'static/css/base-signals.css'
      - 'static/js/base-signals.js'
      - 'static/css/style.css'
      - 'static/js/i18n.js'
      - 'static/i18n/**'
      - 'templates/index.html'
      - 'tests/test_analysis_v4_browser.py'
      - 'tests/test_analysis_v4_i18n_browser.py'
      - 'tests/test_i18n_coverage.py'
      - 'tests/test_full_site_i18n_browser.py'
      - 'tests/test_public_pages_i18n_browser.py'
      - 'tests/test_admin_i18n_browser.py'
      - 'tests/test_admin_overlay_i18n_browser.py'
      - 'tests/test_admin_dynamic_i18n.py'
      - 'tests/test_admin_inline_i18n.py'
      - 'tests/test_admin_dynamic_i18n_browser.py'
      - 'static/js/admin-panel.js'
      - 'static/js/admin-panel.js.src'
      - 'static/i18n/admin.json'
      - 'templates/admin.html'
      - 'templates/landing.html'
      - 'templates/pricing.html'
      - 'templates/rehber*.html'
      - 'templates/nedir.html'
      - 'templates/legal.html'
      - 'templates/analysis.html'
      - 'static/i18n/auth.json'
      - 'templates/status.html'
      - 'tests/test_status_runtime_i18n.py'
      - 'tests/test_status_runtime_i18n_browser.py'
      - 'templates/login.html'
      - 'templates/signup.html'
      - 'templates/forgot_password.html'
      - 'templates/reset_password.html'
      - 'templates/verify_email.html'
      - 'templates/membership_required.html'
      - 'templates/migrate_account.html'
      - 'templates/account.html'
      - 'templates/admin_login.html'
      - '.github/workflows/analysis-v4-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-viewports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser test dependency
        run: python -m pip install --disable-pip-version-check 'playwright==1.55.0'
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test real V4 UI at desktop, tablet, phone, compact and landscape sizes
        run: |
          python tests/test_analysis_v4_browser.py
          python tests/test_analysis_v4_i18n_browser.py
          python tests/test_full_site_i18n_browser.py
          python tests/test_public_pages_i18n_browser.py
          python tests/test_admin_i18n_browser.py
          python tests/test_admin_overlay_i18n_browser.py
          python tests/test_admin_dynamic_i18n.py
          python tests/test_admin_inline_i18n.py
          python tests/test_admin_dynamic_i18n_browser.py
          python tests/test_status_runtime_i18n_browser.py
          python tests/test_status_runtime_i18n.py
          python -m unittest discover -s tests -p test_i18n_coverage.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analizler-v4-responsive-screenshots
          path: artifacts/analizler-v4-*.png
          if-no-files-found: ignore
