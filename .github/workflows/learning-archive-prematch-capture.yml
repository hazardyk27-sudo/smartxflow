name: Learning Archive Prematch Capture

on:
  schedule:
    # Avoid the top-of-hour scheduler hotspot while scanning frequently enough
    # to land one durable revisit inside the final 35 minutes before kickoff.
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learning-archive-prematch-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: main
          path: app
          fetch-depth: 1

      - name: Checkout durable Learning Archive state
        uses: actions/checkout@v4
        with:
          ref: learning-archive
          path: archive
          fetch-depth: 1

      - name: Build due prematch capture batch
        id: due
        shell: bash
        run: |
          set -euo pipefail
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python app/scripts/build_due_learning_revisit_batch.py \
            "$GITHUB_WORKSPACE/archive" \
            --observed-at "$OBSERVED_AT" \
            --max-minutes-before-kickoff 35 \
            --output "$RUNNER_TEMP/due-revisits.json"

          COUNT="$(python - "$RUNNER_TEMP/due-revisits.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          print(len(payload.get('captures') or []))
          PY
          )"
          echo "observed_at=$OBSERVED_AT" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_due=true" >> "$GITHUB_OUTPUT"
            echo "batch_b64=$(base64 -w0 "$RUNNER_TEMP/due-revisits.json")" >> "$GITHUB_OUTPUT"
          else
            echo "has_due=false" >> "$GITHUB_OUTPUT"
          fi
          echo "PREMATCH_CAPTURE_SCAN observed_at=$OBSERVED_AT due=$COUNT"

      - name: Append due captures with durable receipts
        if: steps.due.outputs.has_due == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          BATCH_B64: ${{ steps.due.outputs.batch_b64 }}
          GH_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: BATCH_B64,GH_TOKEN
          script: |
            set -euo pipefail
            cd /opt/smartxflow

            BRANCH="$(git branch --show-current)"
            if [ "$BRANCH" != "main" ]; then
              echo "PREMATCH_CAPTURE_STOP: production runtime branch is '$BRANCH', expected main"
              exit 1
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "PREMATCH_CAPTURE_STOP: tracked production worktree is dirty"
              git status --short
              exit 1
            fi

            TMP="$(mktemp /tmp/sxf-prematch-revisit.XXXXXX.json)"
            trap 'rm -f "$TMP"' EXIT
            printf '%s' "$BATCH_B64" | base64 -d > "$TMP"

            export GH_TOKEN
            export GITHUB_TOKEN="$GH_TOKEN"
            /opt/smartxflow/venv/bin/python \
              /opt/smartxflow/scripts/record_learning_revisit_batch.py \
              "$TMP" \
              --dotenv /opt/smartxflow/.env

      - name: Gate result
        run: |
          echo "PREMATCH_CAPTURE_GATE_OK observed_at=${{ steps.due.outputs.observed_at }} due=${{ steps.due.outputs.count }}"
