name: Verify final Base Early bounded-source retry and SQL fence 2026-10-21

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/base-autonomous-recovery-checks-20261021.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test deps
        run: python -m pip install -q pytest requests beautifulsoup4 certifi
      - name: Run all affected autonomous worker tests and publish report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python -m pytest -q             tests/test_base_signal_priority_lanes.py             tests/test_base_signal_near_term_discovery.py             tests/test_base_signal_phase4c_discovery.py             tests/test_base_signal_hetzner_worker.py             tests/test_base_signal_storage.py             tests/test_base_autonomous_recovery_20261021.py tests/test_base_worker_systemd_watchdog.py tests/test_base_fixture_discovery_worker.py tests/test_base_worker_guarded_recovery.py tests/test_base_backlog_throughput_20261021.py tests/test_base_missing_source_backoff_20261021.py \
            tests/test_betwatch_1x2_mapping_20261021.py \
            tests/test_moneyway_ingest_quality_20261021.py \
            tests/test_runtime_scraper_recovery.py \
            tests/test_betwatch_prematch_identity_runtime.py > /tmp/sxf-base-test.log 2>&1
          RC=$?
          {
            echo "commit=$GITHUB_SHA"
            echo "pytest_exit_code=$RC"
            tail -n 80 /tmp/sxf-base-test.log
          } | tee /tmp/sxf-base-test-report.txt
          CONTENT="$(base64 -w0 /tmp/sxf-base-test-report.txt)"
          DEST="repos/$GITHUB_REPOSITORY/contents/docs/BASE_AUTONOMOUS_RECOVERY_TEST_20261021.txt"
          EXISTING_SHA="$(gh api "$DEST?ref=preview" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api -X PUT "$DEST" -f message="test(base): publish verified recovery test report" -f branch=preview -f content="$CONTENT" -f sha="$EXISTING_SHA" --jq '.commit.sha'
          else
            gh api -X PUT "$DEST" -f message="test(base): publish verified recovery test report" -f branch=preview -f content="$CONTENT" --jq '.commit.sha'
          fi
          exit "$RC"
