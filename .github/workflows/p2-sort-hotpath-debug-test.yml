name: P2 Sort Hotpath Debug Cleanup Test

on:
  push:
    branches: [perf/p2-sort-hotpath-debug-cleanup]

permissions:
  contents: write

jobs:
  sort-hotpath-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-sort-hotpath-debug-cleanup
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove stale sort hot-path debug instrumentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def find_function(text, name):
              m = re.search(r'(?<![\w$])function\s+' + re.escape(name) + r'\s*\(', text)
              if not m:
                  raise RuntimeError(f'{name}: function not found')
              start = m.start()
              brace = text.find('{', m.end())
              depth = 0
              i = brace
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if ch == '*' and nxt == '/': block_comment = False; i += 2
                      else: i += 1
                      continue
                  if quote:
                      if escaped: escaped = False
                      elif ch == '\\': escaped = True
                      elif ch == quote: quote = None
                      i += 1; continue
                  if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
                  if ch == '/' and nxt == '*': block_comment = True; i += 2; continue
                  if ch in ("'", '"', '`'): quote = ch; i += 1; continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return start, i + 1, text[start:i + 1]
                  i += 1
              raise RuntimeError(f'{name}: closing brace not found')

          def remove_console_filter_logs(fn):
              marker = "console.log('[Filter]"
              while marker in fn:
                  start = fn.index(marker)
                  paren = fn.index('(', start)
                  depth = 0
                  quote = None
                  escaped = False
                  i = paren
                  while i < len(fn):
                      ch = fn[i]
                      if quote:
                          if escaped: escaped = False
                          elif ch == '\\': escaped = True
                          elif ch == quote: quote = None
                      else:
                          if ch in ("'", '"', '`'): quote = ch
                          elif ch == '(': depth += 1
                          elif ch == ')':
                              depth -= 1
                              if depth == 0:
                                  end = i + 1
                                  if end < len(fn) and fn[end] == ';': end += 1
                                  fn = fn[:start] + fn[end:]
                                  break
                      i += 1
                  else:
                      raise RuntimeError('unterminated [Filter] console.log')
              return fn

          def cleanup(path):
              p = Path(path)
              text = p.read_text()
              before = len(text.encode())
              start, end, fn = find_function(text, 'applySorting')

              # Remove the extra full-array Man City/Nottm diagnostic scan.
              m = re.search(r'const\s+manCityMatch\s*=', fn)
              if not m:
                  raise RuntimeError(f'{path}: manCity debug scan not found')
              next_filter = re.search(r'sortedData\s*=\s*sortedData\.filter', fn[m.start():])
              if not next_filter:
                  raise RuntimeError(f'{path}: post-manCity filter not found')
              cut_end = m.start() + next_filter.start()
              fn = fn[:m.start()] + fn[cut_end:]

              # Remove odds-filter debug-only tracking and output.
              fn, n = re.subn(
                  r'if\s*\(\s*beforeOddsFilter\s*!==\s*sortedData\.length\s*\)\s*\{.*?\}',
                  '', fn, count=1, flags=re.S,
              )
              if n != 1:
                  raise RuntimeError(f'{path}: beforeOddsFilter log gate not found')
              fn, n = re.subn(r'const\s+beforeOddsFilter\s*=\s*sortedData\.length\s*;', '', fn, count=1)
              if n != 1:
                  raise RuntimeError(f'{path}: beforeOddsFilter counter not found')

              # Everything after the snapshot fallback and before the return is stale
              # Sassuolo/rejected-match diagnostics; retain the functional fallback+return.
              debug_tail = re.compile(
                  r'(if\s*\(\s*!hasValidOdds\s*&&\s*m\.snapshots\s*\)\s*hasValidOdds\s*=\s*checkHistoryArray\(m\.snapshots\)\s*;).*?(return\s+hasValidOdds\s*;)',
                  re.S,
              )
              fn, n = debug_tail.subn(r'\1\2', fn, count=1)
              if n != 1:
                  raise RuntimeError(f'{path}: odds debug tail not found')

              fn = remove_console_filter_logs(fn)

              forbidden = ['[Filter DEBUG]', 'manCityMatch', 'nottmMatches', 'sassuolo', '_debugFilterCount', 'beforeOddsFilter', "console.log('[Filter]"]
              lower_fn = fn.lower()
              leftovers = [x for x in forbidden if x.lower() in lower_fn]
              if leftovers:
                  raise RuntimeError(f'{path}: debug leftovers: {leftovers}')

              required = ['checkCompleteOdds', 'checkHistoryArray', '_mobileHideEnded', '_mobileHideLive', '_mobileOnlyLive', 'currentSortColumn', 'currentSortDirection']
              missing = [x for x in required if x not in fn]
              if missing:
                  raise RuntimeError(f'{path}: functional gates missing: {missing}')

              text = text[:start] + fn + text[end:]
              p.write_text(text)
              after = len(text.encode())
              print(f'{path}: {before} -> {after} ({before-after} bytes removed)')
              return before - after

          src_delta = cleanup('static/js/app.js.src')
          runtime_delta = cleanup('static/js/app.js')
          if src_delta < 1800:
              raise SystemExit(f'source cleanup unexpectedly small: {src_delta}')
          if runtime_delta < 1100:
              raise SystemExit(f'runtime cleanup unexpectedly small: {runtime_delta}')
          PY

      - name: Frontend regression gates
        shell: bash
        run: |
          cp static/js/app.js.src /tmp/app-src.js
          node --check static/js/app.js
          node --check /tmp/app-src.js
          node --test tests/test_sort_hotpath_debug_cleanup.js
          node --test tests/test_modal_chart_helper_split.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_app_bootstrap.js

      - name: Analysis entrypoint sentinel
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_deferred_analysis_ui.py
          node --test tests/test_deferred_analysis_entrypoints.js

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name "SmartXFlow CI"
          git config user.email "smartxflow-ci@users.noreply.github.com"
          git rm .github/workflows/p2-sort-hotpath-debug-test.yml
          git add static/js/app.js static/js/app.js.src tests/test_sort_hotpath_debug_cleanup.js
          git commit -m "perf: remove stale sort hot-path diagnostics"
          git push origin HEAD:perf/p2-sort-hotpath-debug-cleanup
