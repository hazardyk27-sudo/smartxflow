name: Analysis Runtime Fix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/analysis-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact triggering preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Verify branch did not move
        run: |
          set -euo pipefail
          git fetch origin preview
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/preview)" = "$GITHUB_SHA"

      - name: Apply focused coordination and copy fixes
        shell: python
        run: |
          from pathlib import Path
          import csv
          import io
          import json

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, got {count}")
              return text.replace(old, new, 1)

          # 1) Scraper coordination: production remains authoritative while its
          # scrape_complete is fresh. Preview takes over only after a real outage.
          p = Path('scheduled_scraper.py')
          text = p.read_text(encoding='utf-8')
          text = one(
              text,
              'SIGNAL_DEDUP_WINDOW_SECONDS = 120\n_SIGNAL_LOCK_PATH',
              'SIGNAL_DEDUP_WINDOW_SECONDS = 120\nEXTERNAL_MASTER_WINDOW_SECONDS = int(os.environ.get("SMARTXFLOW_EXTERNAL_MASTER_WINDOW_SECONDS", "720"))\n_SIGNAL_LOCK_PATH',
              'external master window constant',
          )
          text = one(
              text,
              '        diff_minutes = (datetime.now(timezone.utc) - beat_time.astimezone(timezone.utc)).total_seconds() / 60\n        if 0 <= diff_minutes < 5:\n            return False, f"{row.get(\'source\', \'external\')} recent scrape ({diff_minutes:.1f} min ago)"\n        return True, f"signal_fallback_stale ({diff_minutes:.1f} min ago)"',
              '        diff_seconds = (datetime.now(timezone.utc) - beat_time.astimezone(timezone.utc)).total_seconds()\n        diff_minutes = diff_seconds / 60\n        if 0 <= diff_seconds < EXTERNAL_MASTER_WINDOW_SECONDS:\n            return False, f"{row.get(\'source\', \'external\')} recent scrape ({diff_minutes:.1f} min ago)"\n        return True, f"signal_fallback_stale ({diff_minutes:.1f} min ago)"',
              'external master freshness window',
          )
          text = one(
              text,
              '    """Aynı scrape sayılarıyla çok kısa sürede ikinci signal üretimini engelle."""',
              '    """Herhangi bir kaynaktan yeni scrape_complete varsa ikinci signal üretimini engelle."""',
              'dedupe docstring',
          )
          text = one(
              text,
              '            f"?source=eq.{SCRAPER_SOURCE}"\n            f"&signal_type=eq.scrape_complete"',
              '            f"?signal_type=eq.scrape_complete"',
              'cross-source dedupe query',
          )
          text = one(
              text,
              '        if int(row.get("match_count") or 0) != int(match_count):\n            return False\n        if int(row.get("snapshot_count") or 0) != int(snapshot_count):\n            return False\n',
              '',
              'remove count-dependent dedupe',
          )
          text = one(
              text,
              '    """Supabase\'den son başarılı replit scrape_complete sinyal zamanını al."""',
              '    """Supabase\'den herhangi bir kaynağın son başarılı scrape_complete zamanını al."""',
              'last signal docstring',
          )
          text = one(
              text,
              '            f"{supabase_url}/rest/v1/scraper_signal?source=eq.replit"\n            f"&signal_type=eq.scrape_complete&order=created_at.desc&limit=1&select=created_at"',
              '            f"{supabase_url}/rest/v1/scraper_signal?signal_type=eq.scrape_complete"\n            f"&order=created_at.desc&limit=1&select=created_at"',
              'last signal cross-source query',
          )
          p.write_text(text, encoding='utf-8')

          # 2) Source-level Sinyal Engine documentation must match live constants.
          p = Path('sinyal_engine.py')
          text = p.read_text(encoding='utf-8')
          old_intro = '''SmartXFlow Sinyal Engine v1.3
İki sinyal tipini aynı anda tarar:
  1. Underdog Pressure: odds >= 2.90, pct >= 50%, volume >= £2,000
  2. Confirmed Money: pct > 80%, oran >= %4 düşüş (10 saat), volume >= £2,000, stabilite onaylı
'''
          new_intro = '''SmartXFlow Sinyal Engine v1.3
Beş sinyal tipini aynı anda tarar:
  1. Underdog Pressure: odds >= 2.90; volume £800-£4,999 ise pct >= 55%, volume >= £5,000 ise pct >= 50%; sadece 1/2
  2. Confirmed Money: volume >= £5,000, pct > 80% son 3 snapshot, odds 1.35-2.20, ilk geçerli orana göre >= %5 düşüş
  3. Confirmed Money V2: volume >= £5,000, pct >= 88% son 3 snapshot, odds 1.55-2.20, >= %7 düşüş; sadece 1/2
  4. Fake Sharp: volume >= £5,000, pct > 75% son 3 snapshot, odds 1.35-2.20, ilk geçerli orana göre >= %5 yükseliş; sadece 1/2
  5. Early Money Lock: kickoff >= 24 saat, volume >= £5,000, aynı seçimde 5 ardışık snapshot pct >= 85%
'''
          text = one(text, old_intro, new_intro, 'signal engine header rules')
          p.write_text(text, encoding='utf-8')

          # 3) Canonical translations for every Analysis signal explanation.
          T = {
            'tr': {
              'rv_underdog_desc': 'Oran ≥2.90. Hacim £800–£4.999 ise para yüzdesi ≥%55; hacim ≥£5.000 ise ≥%50. Yalnız 1/2 seçimleri.',
              'rv_confirmed_desc': 'Hacim ≥£5.000, para yüzdesi >%80 ve son 3 snapshot boyunca >%80; oran 1.35–2.20 ve ilk geçerli orana göre ≥%5 düşüş.',
              'rv_confirmed_v2_desc': 'Hacim ≥£5.000, para yüzdesi ≥%88 ve son 3 snapshot boyunca ≥%88; oran 1.55–2.20 ve ilk geçerli orana göre ≥%7 düşüş. Yalnız 1/2 seçimleri.',
              'rv_early_desc': 'Maça ≥24 saat kala, hacim ≥£5.000 ve aynı seçimde son 5 ardışık snapshot boyunca para yüzdesi ≥%85 olduğunda tetiklenir.',
              'rv_fake_desc': 'Hacim ≥£5.000 ve para yüzdesi >%75 iken son 3 snapshot da >%75; oran 1.35–2.20 ve ilk geçerli orana göre ≥%5 yükseliyorsa tetiklenir. Yalnız 1/2 seçimleri.',
            },
            'en': {
              'rv_underdog_desc': 'Odds ≥2.90. At £800–£4,999 volume, money share must be ≥55%; at ≥£5,000, ≥50%. Home/away selections only.',
              'rv_confirmed_desc': 'Volume ≥£5,000, money share >80% and >80% for the last 3 snapshots; odds 1.35–2.20 with a ≥5% drop from the first valid odds.',
              'rv_confirmed_v2_desc': 'Volume ≥£5,000, money share ≥88% for the last 3 snapshots; odds 1.55–2.20 with a ≥7% drop from the first valid odds. Home/away only.',
              'rv_early_desc': 'Triggers ≥24 hours before kickoff when volume is ≥£5,000 and the same selection holds ≥85% money share for 5 consecutive snapshots.',
              'rv_fake_desc': 'Volume ≥£5,000 and money share >75% for the last 3 snapshots; odds 1.35–2.20 and ≥5% higher than the first valid odds. Home/away only.',
            },
            'de': {
              'rv_underdog_desc': 'Quote ≥2,90. Bei £800–£4.999 Volumen gilt Geldanteil ≥55 %, ab £5.000 ≥50 %. Nur Heim/Auswärts.',
              'rv_confirmed_desc': 'Volumen ≥£5.000, Geldanteil >80 % und in den letzten 3 Snapshots >80 %; Quote 1,35–2,20 und ≥5 % Rückgang gegenüber der ersten gültigen Quote.',
              'rv_confirmed_v2_desc': 'Volumen ≥£5.000, Geldanteil in den letzten 3 Snapshots ≥88 %; Quote 1,55–2,20 und ≥7 % Rückgang gegenüber der ersten gültigen Quote. Nur Heim/Auswärts.',
              'rv_early_desc': 'Auslösung ≥24 Stunden vor Anpfiff bei Volumen ≥£5.000 und ≥85 % Geldanteil derselben Auswahl in 5 aufeinanderfolgenden Snapshots.',
              'rv_fake_desc': 'Volumen ≥£5.000 und Geldanteil >75 % in den letzten 3 Snapshots; Quote 1,35–2,20 und ≥5 % über der ersten gültigen Quote. Nur Heim/Auswärts.',
            },
            'fr': {
              'rv_underdog_desc': 'Cote ≥2,90. Pour £800–£4 999 de volume, part d’argent ≥55 % ; à partir de £5 000, ≥50 %. Sélections domicile/extérieur uniquement.',
              'rv_confirmed_desc': 'Volume ≥£5 000, part d’argent >80 % sur les 3 derniers snapshots ; cote 1,35–2,20 avec baisse ≥5 % depuis la première cote valide.',
              'rv_confirmed_v2_desc': 'Volume ≥£5 000, part d’argent ≥88 % sur les 3 derniers snapshots ; cote 1,55–2,20 avec baisse ≥7 % depuis la première cote valide. Domicile/extérieur uniquement.',
              'rv_early_desc': 'Déclenché ≥24 h avant le coup d’envoi avec volume ≥£5 000 et part d’argent ≥85 % sur la même sélection pendant 5 snapshots consécutifs.',
              'rv_fake_desc': 'Volume ≥£5 000 et part d’argent >75 % sur les 3 derniers snapshots ; cote 1,35–2,20 et hausse ≥5 % depuis la première cote valide. Domicile/extérieur uniquement.',
            },
            'nl': {
              'rv_underdog_desc': 'Odds ≥2,90. Bij £800–£4.999 volume moet het geldpercentage ≥55% zijn; vanaf £5.000 ≥50%. Alleen thuis/uit.',
              'rv_confirmed_desc': 'Volume ≥£5.000, geldpercentage >80% in de laatste 3 snapshots; odds 1,35–2,20 met ≥5% daling vanaf de eerste geldige odds.',
              'rv_confirmed_v2_desc': 'Volume ≥£5.000, geldpercentage ≥88% in de laatste 3 snapshots; odds 1,55–2,20 met ≥7% daling vanaf de eerste geldige odds. Alleen thuis/uit.',
              'rv_early_desc': 'Triggert ≥24 uur voor aftrap bij volume ≥£5.000 en ≥85% geldpercentage op dezelfde selectie gedurende 5 opeenvolgende snapshots.',
              'rv_fake_desc': 'Volume ≥£5.000 en geldpercentage >75% in de laatste 3 snapshots; odds 1,35–2,20 en ≥5% hoger dan de eerste geldige odds. Alleen thuis/uit.',
            },
            'it': {
              'rv_underdog_desc': 'Quota ≥2,90. Con volume £800–£4.999 la quota denaro deve essere ≥55%; da £5.000, ≥50%. Solo casa/trasferta.',
              'rv_confirmed_desc': 'Volume ≥£5.000, quota denaro >80% negli ultimi 3 snapshot; quota 1,35–2,20 con calo ≥5% dalla prima quota valida.',
              'rv_confirmed_v2_desc': 'Volume ≥£5.000, quota denaro ≥88% negli ultimi 3 snapshot; quota 1,55–2,20 con calo ≥7% dalla prima quota valida. Solo casa/trasferta.',
              'rv_early_desc': 'Si attiva ≥24 ore prima del calcio d’inizio con volume ≥£5.000 e quota denaro ≥85% sulla stessa selezione per 5 snapshot consecutivi.',
              'rv_fake_desc': 'Volume ≥£5.000 e quota denaro >75% negli ultimi 3 snapshot; quota 1,35–2,20 e aumento ≥5% dalla prima quota valida. Solo casa/trasferta.',
            },
            'es': {
              'rv_underdog_desc': 'Cuota ≥2,90. Con volumen £800–£4.999, el porcentaje de dinero debe ser ≥55%; desde £5.000, ≥50%. Solo local/visitante.',
              'rv_confirmed_desc': 'Volumen ≥£5.000, porcentaje de dinero >80% en los últimos 3 snapshots; cuota 1,35–2,20 con caída ≥5% desde la primera cuota válida.',
              'rv_confirmed_v2_desc': 'Volumen ≥£5.000, porcentaje de dinero ≥88% en los últimos 3 snapshots; cuota 1,55–2,20 con caída ≥7% desde la primera cuota válida. Solo local/visitante.',
              'rv_early_desc': 'Se activa ≥24 h antes del inicio con volumen ≥£5.000 y ≥85% del dinero en la misma selección durante 5 snapshots consecutivos.',
              'rv_fake_desc': 'Volumen ≥£5.000 y porcentaje de dinero >75% en los últimos 3 snapshots; cuota 1,35–2,20 y subida ≥5% desde la primera cuota válida. Solo local/visitante.',
            },
          }

          for lang, values in T.items():
              path = Path(f'static/i18n/{lang}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              target = data['app']['j']
              for key, value in values.items():
                  if key not in target:
                      raise SystemExit(f'{path}: missing {key}')
                  target[key] = value
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          master = Path('static/i18n/_master.csv')
          with master.open('r', encoding='utf-8', newline='') as fh:
              rows = list(csv.reader(fh))
          lang_cols = {'tr': 2, 'en': 3, 'de': 4, 'fr': 5, 'nl': 6, 'it': 7, 'es': 8}
          keys_seen = set()
          for row in rows:
              if not row:
                  continue
              prefix = 'app.j.'
              if row[0].startswith(prefix):
                  short = row[0][len(prefix):]
                  if short in T['tr']:
                      if len(row) < 9:
                          raise SystemExit(f'master row too short: {row[0]}')
                      for lang, col in lang_cols.items():
                          row[col] = T[lang][short]
                      keys_seen.add(short)
          if keys_seen != set(T['tr']):
              raise SystemExit(f'master missing keys: {set(T["tr"]) - keys_seen}')
          with master.open('w', encoding='utf-8', newline='') as fh:
              writer = csv.writer(fh, quoting=csv.QUOTE_ALL, lineterminator='\r\n')
              writer.writerows(rows)

          # Detail views previously bypassed i18n and hard-coded retired rules.
          p = Path('static/js/inline.js.src')
          text = p.read_text(encoding='utf-8')
          detail_replacements = {
              'Oran ≥ 3.00 olan underdog tarafa para akışının ≥ %50 olduğu bugün/gelecek maçları tespit eder.': "' + _t('app.j.rv_underdog_desc','" + T['tr']['rv_underdog_desc'] + "') + '",
              'Para akışı ≥%80, oran 16 saat içinde monoton düşen (≥%4), hacim ≥£2,000 olan maçları tespit eder.': "' + _t('app.j.rv_confirmed_desc','" + T['tr']['rv_confirmed_desc'] + "') + '",
              'Para akışı ≥%88, oran 1.55-2.20, ≥%7 düşüş — 3 günlük araştırmada sıfır kayıp. Sadece 1/2 seçimleri.': "' + _t('app.j.rv_confirmed_v2_desc','" + T['tr']['rv_confirmed_v2_desc'] + "') + '",
              'Para akışı erken kilitlenmiş ve birbirini izleyen anlık görüntülerde sabit kalan maçları tespit eder.': "' + _t('app.j.rv_early_desc','" + T['tr']['rv_early_desc'] + "') + '",
              'Para akışına rağmen oran yükselen — yani sharp olmayan, halk parası olduğu anlaşılan maçları tespit eder.': "' + _t('app.j.rv_fake_desc','" + T['tr']['rv_fake_desc'] + "') + '",
          }
          for old, new in detail_replacements.items():
              text = one(text, old, new, f'detail copy: {old[:30]}')
          p.write_text(text, encoding='utf-8')

          # Runtime regression tests for cross-source coordination.
          p = Path('tests/test_runtime_scraper_recovery.py')
          text = p.read_text(encoding='utf-8')
          marker = 'def test_send_signal_skips_recent_duplicate(monkeypatch):\n'
          new_test = '''def test_master_fallback_keeps_preview_standby_for_nine_minute_external_signal(monkeypatch):
    mod = _load_scheduled_scraper_with_stubs(monkeypatch)
    mod.SCRAPER_SOURCE = "replit-preview"
    mod._HEARTBEAT_TABLE_AVAILABLE = False
    created_at = (datetime.now(timezone.utc) - timedelta(minutes=9)).isoformat()

    response = Mock()
    response.status_code = 200
    response.json.return_value = [{"source": "replit", "created_at": created_at}]
    monkeypatch.setattr(mod.requests, "get", Mock(return_value=response))

    is_master, reason = mod.check_master_status("https://example.supabase.co", "key")
    assert is_master is False
    assert "recent scrape" in reason


'''
          if new_test.strip() not in text:
              text = one(text, marker, new_test + marker, 'nine-minute external-master test')
          text = one(
              text,
              '    monkeypatch.setattr(mod, "fcntl", None)\n\n    response = Mock()\n    response.status_code = 200\n    response.json.return_value = [\n        {\n            "id": 101,\n            "created_at": (datetime.now(timezone.utc) - timedelta(seconds=5)).isoformat(),\n            "match_count": 614,\n            "snapshot_count": 1327,\n        }\n    ]',
              '    monkeypatch.setattr(mod, "fcntl", None)\n    mod.SCRAPER_SOURCE = "replit-preview"\n\n    response = Mock()\n    response.status_code = 200\n    response.json.return_value = [\n        {\n            "id": 101,\n            "source": "replit",\n            "created_at": (datetime.now(timezone.utc) - timedelta(seconds=5)).isoformat(),\n            "match_count": 3186,\n            "snapshot_count": 3186,\n        }\n    ]',
              'cross-source duplicate test fixture',
          )
          p.write_text(text, encoding='utf-8')

          # Permanent copy regression test.
          copy_test = Path('tests/test_analysis_signal_copy.py')
          copy_test.write_text('''from pathlib import Path\nimport json\n\nROOT = Path(__file__).resolve().parents[1]\n\nEXPECTED_TR = {\n    "rv_underdog_desc": "Oran ≥2.90. Hacim £800–£4.999 ise para yüzdesi ≥%55; hacim ≥£5.000 ise ≥%50. Yalnız 1/2 seçimleri.",\n    "rv_confirmed_desc": "Hacim ≥£5.000, para yüzdesi >%80 ve son 3 snapshot boyunca >%80; oran 1.35–2.20 ve ilk geçerli orana göre ≥%5 düşüş.",\n    "rv_confirmed_v2_desc": "Hacim ≥£5.000, para yüzdesi ≥%88 ve son 3 snapshot boyunca ≥%88; oran 1.55–2.20 ve ilk geçerli orana göre ≥%7 düşüş. Yalnız 1/2 seçimleri.",\n    "rv_early_desc": "Maça ≥24 saat kala, hacim ≥£5.000 ve aynı seçimde son 5 ardışık snapshot boyunca para yüzdesi ≥%85 olduğunda tetiklenir.",\n    "rv_fake_desc": "Hacim ≥£5.000 ve para yüzdesi >%75 iken son 3 snapshot da >%75; oran 1.35–2.20 ve ilk geçerli orana göre ≥%5 yükseliyorsa tetiklenir. Yalnız 1/2 seçimleri.",\n}\n\nRETIRED = (\n    "Oran ≥ 3.00 olan underdog",\n    "oran 16 saat içinde monoton düşen (≥%4), hacim ≥£2,000",\n    "3 günlük araştırmada sıfır kayıp",\n    "Para akışı erken kilitlenmiş ve birbirini izleyen",\n    "sharp olmayan, halk parası olduğu anlaşılan",\n)\n\ndef test_turkish_locale_matches_live_signal_rules():\n    data = json.loads((ROOT / "static/i18n/tr.json").read_text(encoding="utf-8"))\n    for key, expected in EXPECTED_TR.items():\n        assert data["app"]["j"][key] == expected\n\ndef test_detail_views_use_i18n_rule_copy_and_no_retired_text():\n    src = (ROOT / "static/js/inline.js.src").read_text(encoding="utf-8")\n    for key in EXPECTED_TR:\n        assert f"_t('app.j.{key}'" in src\n    for retired in RETIRED:\n        assert retired not in src\n''', encoding='utf-8')

          # Permanent CI for explanation drift.
          ci = Path('.github/workflows/analysis-copy-tests.yml')
          ci.write_text('''name: Analysis Copy Tests\n\non:\n  push:\n    branches: [preview]\n    paths:\n      - 'sinyal_engine.py'\n      - 'static/js/inline.js.src'\n      - 'static/js/i18n.js'\n      - 'static/i18n/**'\n      - 'tests/test_analysis_signal_copy.py'\n      - '.github/workflows/analysis-copy-tests.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  analysis-copy:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.11'\n      - name: Build generated UI bundles\n        run: python minify.py\n      - name: Verify generated bundles are committed\n        run: git diff --exit-code -- static/js/inline.js static/js/ui.js\n      - name: Check JavaScript syntax\n        run: node --check static/js/ui.js\n      - name: Run analysis copy regression\n        run: |\n          python -m pip install --disable-pip-version-check pytest\n          python -m pytest -q tests/test_analysis_signal_copy.py\n''', encoding='utf-8')

      - name: Generate UI bundles and validate
        run: |
          set -euo pipefail
          python minify.py
          node --check static/js/ui.js
          python -m py_compile scheduled_scraper.py sinyal_engine.py scripts/cleanup_signal_retention.py
          python -m pip install --disable-pip-version-check -q pytest httpx requests pytz
          python -m pytest -q \
            tests/test_runtime_scraper_recovery.py \
            tests/test_analysis_signal_copy.py
          git diff --check

      - name: Commit fixes to preview
        run: |
          set -euo pipefail
          git fetch origin preview
          test "$(git rev-parse origin/preview)" = "$GITHUB_SHA"
          git config user.name "SmartXFlow Analysis Runtime Fix"
          git config user.email "actions@users.noreply.github.com"
          git add scheduled_scraper.py sinyal_engine.py tests/test_runtime_scraper_recovery.py \
            static/js/inline.js.src static/js/inline.js static/js/ui.js static/js/i18n.js \
            static/i18n tests/test_analysis_signal_copy.py .github/workflows/analysis-copy-tests.yml
          git commit -m "Harden scraper coordination and align analysis rule copy"
          git push origin HEAD:preview
