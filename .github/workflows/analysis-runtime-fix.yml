name: Analysis Runtime Fix

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/analysis-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact triggering preview
        uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Verify branch did not move
        run: |
          set -euo pipefail
          git fetch origin preview
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/preview)" = "$GITHUB_SHA"

      - name: Apply focused patch
        run: python scripts/apply_analysis_runtime_fix.py

      - name: Generate and validate
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest httpx requests pytz csscompressor rjsmin
          python minify.py
          node --check static/js/ui.js
          python -m py_compile scheduled_scraper.py sinyal_engine.py scripts/cleanup_signal_retention.py
          python -m pytest -q \
            tests/test_runtime_scraper_recovery.py \
            tests/test_analysis_signal_copy.py
          git diff --check

      - name: Commit fixes to preview
        run: |
          set -euo pipefail
          git fetch origin preview
          test "$(git rev-parse origin/preview)" = "$GITHUB_SHA"
          git config user.name "SmartXFlow Analysis Runtime Fix"
          git config user.email "actions@users.noreply.github.com"
          git add scheduled_scraper.py sinyal_engine.py tests/test_runtime_scraper_recovery.py \
            tests/test_analysis_signal_copy.py .github/workflows/alarm-rule-tests.yml \
            static/js/inline.js.src static/js/inline.js static/js/ui.js
          git commit -m "Harden scraper coordination and align analysis rule copy"
          git push origin HEAD:preview
