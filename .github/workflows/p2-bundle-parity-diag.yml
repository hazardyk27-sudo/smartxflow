name: P2 Bundle Parity Diagnostic

on:
  push:
    branches: [perf/p2-chart-export-split]

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check rjsmin
      - name: Report compact parity diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import rjsmin
          src = Path('static/js/app.js.src').read_text(encoding='utf-8')
          runtime = Path('static/js/app.js').read_text(encoding='utf-8')
          generated = rjsmin.jsmin(src)
          print('src_bytes=', len(src.encode()))
          print('runtime_bytes=', len(runtime.encode()))
          print('generated_bytes=', len(generated.encode()))
          print('runtime_sha256=', sha256(runtime.encode()).hexdigest())
          print('generated_sha256=', sha256(generated.encode()).hexdigest())
          if runtime == generated:
              print('PARITY=exact')
          else:
              limit = min(len(runtime), len(generated))
              idx = next((i for i in range(limit) if runtime[i] != generated[i]), limit)
              print('PARITY=mismatch')
              print('first_diff_index=', idx)
              print('runtime_context=', repr(runtime[max(0,idx-120):idx+240]))
              print('generated_context=', repr(generated[max(0,idx-120):idx+240]))
          PY
