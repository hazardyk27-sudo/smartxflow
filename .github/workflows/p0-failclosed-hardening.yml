name: P0 Fail-Closed Hardening

on:
  push:
    branches: [preview]
    paths:
      - '.github/workflows/p0-failclosed-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sinyal_first_snapshot_fetch.py')
          text = path.read_text()
          old = '''    if candidates is None:\n        # Preserve existing behavior if the optimization cannot prove current\n        # state.  This path should be exceptional; correctness wins over speed.\n        engine.log("[FirstSnapIndexed] current state unproven; falling back to legacy scan")\n        return legacy(active_keys)\n'''
          new = '''    if candidates is None:\n        # Fail closed instead of reviving the legacy full-table OFFSET scan.\n        # The runtime already skips signal decisions when a required first\n        # snapshot is unavailable; protecting a degraded DB is safer than\n        # issuing hundreds of deep history pages.\n        engine.log("[FirstSnapIndexed] current state unproven; fail-closed without legacy scan")\n        return result\n'''
          if old not in text:
              raise SystemExit('expected fallback block not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('tests/test_signal_first_snapshot_fetch.py')
          test_text = test_path.read_text()
          marker = 'def test_current_table_error_fails_closed_without_global_offset_fallback'
          if marker not in test_text:
              test_text += '''\n\ndef test_current_table_error_fails_closed_without_global_offset_fallback(monkeypatch):\n    engine, calls = _engine()\n    indexed.install_first_snapshot_fetch(engine)\n    active_key = "A|B|2026-11-12T19:45:00+00:00"\n\n    monkeypatch.setattr(\n        indexed.requests,\n        "get",\n        lambda *args, **kwargs: Response(status_code=503, payload=[], text="temporary failure"),\n    )\n\n    assert engine.fetch_first_snapshots({active_key}) == {}\n    assert calls["legacy"] == 0\n    assert any("fail-closed without legacy scan" in line for line in calls["logs"])\n'''
              test_path.write_text(test_text)
          PY
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest requests pytz python-dateutil
      - name: Compile and test
        run: |
          python -m py_compile sinyal_first_snapshot_fetch.py sinyal_engine_runtime.py
          python -m pytest -q tests/test_signal_first_snapshot_fetch.py tests/test_sinyal_engine_runtime.py tests/test_signal_cooldown_timestamp_encoding.py
      - name: Commit tested hardening
        run: |
          git config user.name 'SmartXFlow CI'
          git config user.email 'smartxflow-ci@users.noreply.github.com'
          git add sinyal_first_snapshot_fetch.py tests/test_signal_first_snapshot_fetch.py
          git commit -m 'perf: fail closed instead of reviving deep history scan'
          git push origin HEAD:preview
