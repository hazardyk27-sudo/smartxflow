name: Hash System Tests

on:
  push:
    branches: [preview, main, master]
    paths:
      - 'core/hash_utils.py'
      - 'core/fixture_identity_v2.py'
      - 'core/fixture_identity_shadow.py'
      - 'core/fixture_identity_payload_stage.py'
      - 'core/fixture_uid_dual_write.py'
      - 'core/fixture_uid_provider_gate.py'
      - 'core/fixture_uid_writer_preflight.py'
      - 'core/fixture_uid_authoritative_writer.py'
      - 'core/fixture_uid_authoritative_activation.py'
      - 'core/fixture_uid_snapshot_authoritative.py'
      - 'core/current_table_sync.py'
      - 'services/**'
      - 'betwatch_client.py'
      - 'betwatch_prematch.py'
      - 'prematch_authoritative_runtime.py'
      - 'run_services.sh'
      - 'live_scraper.py'
      - 'sinyal_engine.py'
      - 'sinyal_engine_runtime.py'
      - 'sql/backfill_history_hash.py'
      - 'scripts/cleanup_duplicate_fixtures.py'
      - 'scripts/remap_duplicate_fixture_references.py'
      - 'scripts/fixture_identity_v2_dry_run.sql'
      - 'scripts/fixture_identity_v2_part5_postflight.sql'
      - 'scripts/fixture_identity_v2_part9_preflight.sql'
      - 'scripts/fixture_identity_v2_part9_postflight.sql'
      - 'scripts/run_fixture_identity_shadow_probe.py'
      - 'scripts/run_fixture_uid_dual_write_probe.py'
      - 'scripts/run_fixture_uid_writer_preflight.py'
      - 'scripts/run_fixture_uid_authoritative_activation_probe.py'
      - 'migrations/2026_10_05_fixture_identity_v2_additive.sql'
      - 'migrations/2026_10_06_fixture_identity_v2_shadow_rpc.sql'
      - 'migrations/2026_10_06_fixture_identity_v2_reference_columns.sql'
      - 'migrations/2026_10_06_fixture_identity_v2_provider_writer.sql'
      - 'desktop/scraper_standalone/**'
      - 'tests/test_hash.py'
      - 'tests/test_fixture_integrity.py'
      - 'tests/test_fixture_identity_v2.py'
      - 'tests/test_fixture_identity_v2_migration.py'
      - 'tests/test_fixture_identity_shadow.py'
      - 'tests/test_fixture_identity_shadow_migration.py'
      - 'tests/test_fixture_identity_v2_reference_columns.py'
      - 'tests/test_fixture_uid_dual_write.py'
      - 'tests/test_fixture_uid_provider_gate.py'
      - 'tests/test_fixture_uid_writer_preflight.py'
      - 'tests/test_fixture_uid_authoritative_writer.py'
      - 'tests/test_fixture_uid_authoritative_activation.py'
      - 'tests/test_fixture_uid_authoritative_activation_probe.py'
      - 'tests/test_fixture_uid_snapshot_dual_write.py'
      - 'tests/test_fixture_uid_snapshot_authoritative.py'
      - 'tests/test_fixture_uid_reader_patch.py'
      - 'tests/test_betwatch_prematch_identity_runtime.py'
      - 'tests/test_prematch_authoritative_runtime.py'
      - 'tests/test_fixture_identity_part9_guard_sql.py'
      - 'tests/test_fixture_reference_remap.py'
      - 'tests/test_current_table_sync.py'
      - 'docs/fixture_identity_v2.md'
      - '.github/workflows/hash_tests.yml'
  pull_request:
    branches: [preview, main, master]
  workflow_dispatch:

jobs:
  hash-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: python -m pip install --disable-pip-version-check pytest httpx requests pytz

    - name: Compile hash producers and consumers
      run: |
        python -m py_compile core/hash_utils.py
        python -m py_compile core/fixture_identity_v2.py
        python -m py_compile core/fixture_identity_shadow.py
        python -m py_compile core/fixture_identity_payload_stage.py
        python -m py_compile core/fixture_uid_dual_write.py
        python -m py_compile core/fixture_uid_provider_gate.py
        python -m py_compile core/fixture_uid_writer_preflight.py
        python -m py_compile core/fixture_uid_authoritative_writer.py
        python -m py_compile core/fixture_uid_authoritative_activation.py
        python -m py_compile core/fixture_uid_snapshot_authoritative.py
        python -m py_compile core/current_table_sync.py
        python -m py_compile betwatch_client.py
        python -m py_compile betwatch_prematch.py
        python -m py_compile prematch_authoritative_runtime.py
        python -m py_compile live_scraper.py
        python -m py_compile services/supabase_client.py
        python -m py_compile services/fixture_uid_reader_patch.py
        python -m py_compile sql/backfill_history_hash.py
        python -m py_compile scripts/cleanup_duplicate_fixtures.py
        python -m py_compile scripts/remap_duplicate_fixture_references.py
        python -m py_compile scripts/run_fixture_identity_shadow_probe.py
        python -m py_compile scripts/run_fixture_uid_dual_write_probe.py
        python -m py_compile scripts/run_fixture_uid_writer_preflight.py
        python -m py_compile scripts/run_fixture_uid_authoritative_activation_probe.py
        python -m py_compile desktop/scraper_standalone/backfill_hashes.py
        python -m py_compile desktop/scraper_standalone/betwatch_client.py

    - name: Run canonical hash regressions
      run: python tests/test_hash.py

    - name: Run fixture identity regressions
      run: |
        python -m pytest -q tests/test_fixture_integrity.py
        python -m pytest -q tests/test_fixture_identity_v2.py
        python -m pytest -q tests/test_fixture_identity_v2_migration.py
        python -m pytest -q tests/test_fixture_identity_shadow.py
        python -m pytest -q tests/test_fixture_identity_shadow_migration.py
        python -m pytest -q tests/test_fixture_identity_v2_reference_columns.py
        python -m pytest -q tests/test_fixture_uid_dual_write.py
        python -m pytest -q tests/test_fixture_uid_provider_gate.py
        python -m pytest -q tests/test_fixture_uid_writer_preflight.py
        python -m pytest -q tests/test_fixture_uid_authoritative_writer.py
        python -m pytest -q tests/test_fixture_uid_authoritative_activation.py
        python -m pytest -q tests/test_fixture_uid_authoritative_activation_probe.py
        python -m pytest -q tests/test_fixture_uid_snapshot_dual_write.py
        python -m pytest -q tests/test_fixture_uid_snapshot_authoritative.py
        python -m pytest -q tests/test_fixture_uid_reader_patch.py
        python -m pytest -q tests/test_betwatch_prematch_identity_runtime.py
        python -m pytest -q tests/test_prematch_authoritative_runtime.py
        python -m pytest -q tests/test_fixture_identity_part9_guard_sql.py
        python -m pytest -q tests/test_current_table_sync.py

    - name: Run fixture reference remap planner regressions
      run: python -m pytest -q tests/test_fixture_reference_remap.py
