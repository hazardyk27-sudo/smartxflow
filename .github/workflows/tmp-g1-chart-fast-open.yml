name: Temporary G1 Chart Fast Open Patch

on:
  push:
    branches:
      - perf/g1-chart-fast-open

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped patch
        run: python3 scripts/tmp_apply_g1_chart_fast_open.py
      - name: Syntax and focused regressions
        run: |
          node --check < static/js/app.js.src
          node --check static/js/app.js
          node --check < static/js/modal-entry.js.src
          node --check static/js/modal-entry.js
          node --test tests/test_deferred_chart_libs.js tests/test_modal_entry_code_split.js tests/test_chart_export_code_split.js tests/test_modal_history_cache_key.js
      - name: Commit patch and remove temporary helpers
        run: |
          rm .github/workflows/tmp-g1-chart-fast-open.yml
          rm scripts/tmp_apply_g1_chart_fast_open.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/app.js.src static/js/app.js static/js/modal-entry.js.src static/js/modal-entry.js tests/test_deferred_chart_libs.js .github/workflows/tmp-g1-chart-fast-open.yml scripts/tmp_apply_g1_chart_fast_open.py
          git commit -m "perf: reduce cold chart open work"
          git push origin HEAD:perf/g1-chart-fast-open
