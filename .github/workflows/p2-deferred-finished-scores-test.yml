name: P2 Deferred Finished Scores Test

on:
  push:
    branches: [perf/p2-defer-finished-scores]

permissions:
  contents: write

jobs:
  deferred-finished-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/p2-defer-finished-scores
          fetch-depth: 0

      - name: Defer finished score bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          old_source = "runOptionalStartupTask('finished scores', loadFinishedScores);"
          replacement = """runOptionalStartupTask('finished scores', () => {
              const loadScores = () => loadFinishedScores(true);
              if (typeof window.requestIdleCallback === 'function') {
                  window.requestIdleCallback(loadScores, { timeout: 5000 });
              } else {
                  setTimeout(loadScores, 2500);
              }
          });"""

          for filename in ('static/js/app.js.src', 'static/js/app.js'):
              path = Path(filename)
              source = path.read_text()
              count = source.count(old_source)
              if count != 1:
                  raise SystemExit(f'{filename}: expected one finished-score startup anchor, got {count}')
              path.write_text(source.replace(old_source, replacement, 1))
          PY

          cat > tests/test_deferred_finished_scores.js <<'JSTEST'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');
          const vm = require('node:vm');

          function extractFinishedStartup(source) {
            const start = source.indexOf("runOptionalStartupTask('finished scores'");
            assert.ok(start >= 0, 'finished score startup task should exist');
            const end = source.indexOf("runOptionalStartupTask('favorites'", start);
            assert.ok(end > start, 'favorites startup should follow finished scores');
            return source.slice(start, end);
          }

          for (const file of ['app.js.src', 'app.js']) {
            const source = fs.readFileSync(path.join(__dirname, '..', 'static', 'js', file), 'utf8');
            const snippet = extractFinishedStartup(source);

            test(`finished scores wait for browser idle (${file})`, () => {
              let idleCallback = null;
              let calls = 0;
              let rerenderArg = null;
              const context = {
                runOptionalStartupTask(name, task) {
                  assert.equal(name, 'finished scores');
                  task();
                },
                loadFinishedScores(arg) {
                  calls += 1;
                  rerenderArg = arg;
                },
                setTimeout() {
                  throw new Error('timer fallback must not run when requestIdleCallback exists');
                },
                window: {
                  requestIdleCallback(callback, options) {
                    idleCallback = callback;
                    assert.equal(options.timeout, 5000);
                  }
                }
              };

              vm.runInNewContext(snippet, context);
              assert.equal(calls, 0, 'finished scores must not fetch synchronously during dashboard bootstrap');
              assert.equal(typeof idleCallback, 'function');
              idleCallback();
              assert.equal(calls, 1);
              assert.equal(rerenderArg, true, 'late score arrival must repaint already-rendered matches');
            });

            test(`finished scores use delayed fallback (${file})`, () => {
              let timerCallback = null;
              let timerDelay = null;
              let calls = 0;
              const context = {
                runOptionalStartupTask(name, task) { task(); },
                loadFinishedScores(arg) {
                  calls += 1;
                  assert.equal(arg, true);
                },
                setTimeout(callback, delay) {
                  timerCallback = callback;
                  timerDelay = delay;
                  return 7;
                },
                window: {}
              };

              vm.runInNewContext(snippet, context);
              assert.equal(calls, 0);
              assert.equal(timerDelay, 2500);
              assert.equal(typeof timerCallback, 'function');
              timerCallback();
              assert.equal(calls, 1);
            });
          }
          JSTEST

      - name: Run deferred score regressions
        run: |
          cp static/js/app.js.src /tmp/app-src.js
          node --check /tmp/app-src.js
          node --check static/js/app.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_app_bootstrap.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_analysis_entrypoints.js

      - name: Commit tested implementation
        run: |
          git config user.name 'SmartXFlow CI'
          git config user.email 'smartxflow-ci@users.noreply.github.com'
          git add static/js/app.js static/js/app.js.src tests/test_deferred_finished_scores.js
          git rm .github/workflows/p2-deferred-finished-scores-test.yml
          git commit -m 'perf: defer finished scores until idle'
          git push origin HEAD:perf/p2-defer-finished-scores
