# Curated Hetzner cutover release gate.
name: Hetzner Runtime Contract Tests

on:
  push:
    branches: [preview, main]
    paths:
      - 'deploy/systemd/**'
      - 'deploy/smartxflow-sinyal.service'
      - 'deploy/env.template'
      - 'deploy/sync_runtime_units.sh'
      - 'deploy/hetzner_preflight.sh'
      - 'deploy/cutover_web_to_hetzner.sh'
      - 'deploy/nginx-smartxflow.conf'
      - 'deploy/sudoers-smartxflow-deploy'
      - 'run_services.sh'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/hetzner-web-cutover.yml'
      - 'tests/test_hetzner_runtime_contract.py'
      - 'tests/test_hetzner_web_cutover_contract.py'
      - '.github/workflows/hetzner-runtime-contract-tests.yml'
  pull_request:
    paths:
      - 'deploy/systemd/**'
      - 'deploy/smartxflow-sinyal.service'
      - 'deploy/env.template'
      - 'deploy/sync_runtime_units.sh'
      - 'deploy/hetzner_preflight.sh'
      - 'deploy/cutover_web_to_hetzner.sh'
      - 'deploy/nginx-smartxflow.conf'
      - 'deploy/sudoers-smartxflow-deploy'
      - 'run_services.sh'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/hetzner-web-cutover.yml'
      - 'tests/test_hetzner_runtime_contract.py'
      - 'tests/test_hetzner_web_cutover_contract.py'
      - '.github/workflows/hetzner-runtime-contract-tests.yml'

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pytest pyyaml
      - run: bash -n deploy/sync_runtime_units.sh
      - run: bash -n deploy/hetzner_preflight.sh
      - run: bash -n deploy/cutover_web_to_hetzner.sh
      - run: bash -n run_services.sh
      - run: sudo /usr/sbin/visudo -cf deploy/sudoers-smartxflow-deploy
      - run: python -c "import yaml; yaml.safe_load(open('.github/workflows/deploy.yml', encoding='utf-8')); yaml.safe_load(open('.github/workflows/hetzner-web-cutover.yml', encoding='utf-8'))"
      - run: python -m pytest -q tests/test_hetzner_runtime_contract.py tests/test_hetzner_web_cutover_contract.py
