name: Frontend Performance Tests

on:
  push:
    branches: [preview]
    paths:
      - 'templates/index.html'
      - 'static/js/app.js'
      - 'static/js/app.js.src'
      - 'static/js/modal-chart.js'
      - 'static/js/modal-chart.js.src'
      - 'static/js/modal-alarms.js'
      - 'static/js/modal-alarms.js.src'
      - 'tests/test_deferred_analysis_ui.py'
      - 'tests/test_deferred_analysis_entrypoints.js'
      - 'tests/test_deferred_chart_libs.js'
      - 'tests/test_deferred_background_live.js'
      - 'tests/test_deferred_finished_scores.js'
      - 'tests/test_deferred_modal_prefetch.js'
      - 'tests/test_modal_chart_code_split.js'
      - 'tests/test_modal_chart_helper_split.js'
      - 'tests/test_sort_hotpath_debug_cleanup.js'
      - 'tests/test_modal_alarm_code_split.js'
      - 'tests/test_app_bootstrap.js'
      - '.github/workflows/frontend-performance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run deferred frontend regressions
        run: |
          python -m pytest -q tests/test_deferred_analysis_ui.py
          node --test tests/test_deferred_analysis_entrypoints.js
          node --test tests/test_deferred_chart_libs.js
          node --test tests/test_deferred_background_live.js
          node --test tests/test_deferred_finished_scores.js
          node --test tests/test_deferred_modal_prefetch.js
          node --test tests/test_modal_chart_code_split.js
          node --test tests/test_modal_chart_helper_split.js
          node --test tests/test_sort_hotpath_debug_cleanup.js
          node --test tests/test_modal_alarm_code_split.js
          node --test tests/test_app_bootstrap.js