name: Frontend Performance Tests

on:
  push:
    branches: [preview]
    paths:
      - 'templates/index.html'
      - 'tests/test_deferred_analysis_ui.py'
      - '.github/workflows/frontend-performance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run deferred frontend regressions
        run: python -m pytest -q tests/test_deferred_analysis_ui.py
