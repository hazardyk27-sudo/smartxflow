name: Alarm Rule Tests

on:
  push:
    branches: [preview]
    paths:
      - 'alarm_engine.py'
      - 'scheduled_scraper.py'
      - 'live_scraper.py'
      - 'sinyal_engine.py'
      - 'sinyal_engine_runtime.py'
      - 'run_services.sh'
      - 'deploy/setup_hetzner.sh'
      - 'deploy/smartxflow-sinyal.service'
      - 'betwatch_prematch.py'
      - 'betwatch_client.py'
      - 'services/supabase_client.py'
      - 'scripts/cleanup_duplicate_fixtures.py'
      - 'desktop/scraper_standalone/betwatch_client.py'
      - 'desktop/scraper_standalone/alarm_calculator.py'
      - 'desktop/scraper_standalone/alarm_calculator_legacy.py'
      - 'desktop/scraper_standalone/alarm_recent.py'
      - 'desktop/scraper_standalone/alarm_recent_base.py'
      - 'desktop/scraper_standalone/alarm_recent_part2.py'
      - 'desktop/scraper_standalone/alarm_recent_part3.py'
      - 'learning_archive/**'
      - 'core/current_table_sync.py'
      - 'core/retention_guard.py'
      - 'migrations/**'
      - 'static/js/inline.js.src'
      - 'static/js/i18n.js'
      - 'tests/test_alarm_engine_freshness.py'
      - 'tests/test_alarm_calculator_rule_guards.py'
      - 'tests/test_alarm_recent_incremental.py'
      - 'tests/test_alarm_recent_part2.py'
      - 'tests/test_alarm_recent_part3.py'
      - 'tests/test_current_table_sync.py'
      - 'tests/test_prematch_master_watchdog.py'
      - 'tests/test_runtime_scraper_recovery.py'
      - 'tests/test_sinyal_engine_runtime.py'
      - 'tests/test_analysis_signal_copy.py'
      - 'tests/test_fixture_integrity.py'
      - 'tests/test_learning_archive.py'
      - 'tests/test_learning_archive_api.py'
      - 'tests/test_learning_archive_lifecycle_guards.py'
      - '.github/workflows/alarm-rule-tests.yml'
      - '.github/workflows/learning-archive-record.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alarm-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest httpx requests pytz flask python-dateutil
      - name: Compile alarm, scraper, and archive modules
        run: |
          python -m py_compile alarm_engine.py
          python -m py_compile scheduled_scraper.py
          python -m py_compile live_scraper.py
          python -m py_compile sinyal_engine.py
          python -m py_compile sinyal_engine_runtime.py
          python -m py_compile betwatch_prematch.py
          python -m py_compile betwatch_client.py
          python -m py_compile services/supabase_client.py
          python -m py_compile scripts/cleanup_duplicate_fixtures.py
          python -m py_compile desktop/scraper_standalone/betwatch_client.py
          python -m py_compile desktop/scraper_standalone/alarm_calculator.py
          python -m py_compile desktop/scraper_standalone/alarm_calculator_legacy.py
          python -m py_compile desktop/scraper_standalone/alarm_recent.py
          python -m py_compile desktop/scraper_standalone/alarm_recent_base.py
          python -m py_compile desktop/scraper_standalone/alarm_recent_part2.py
          python -m py_compile desktop/scraper_standalone/alarm_recent_part3.py
          python -m py_compile learning_archive/exporter.py
          python -m py_compile learning_archive/retention.py
          python -m py_compile learning_archive/supabase_source.py
          python -m py_compile core/current_table_sync.py
          python -m py_compile core/retention_guard.py
      - name: Validate service supervisor shell syntax
        run: |
          bash -n run_services.sh
          bash -n deploy/setup_hetzner.sh
          ! grep -q 'sinyal_engine_runtime.py' run_services.sh
          grep -q 'sinyal_engine_runtime.py' deploy/smartxflow-sinyal.service
      - name: Run alarm, scraper, and archive regression tests
        run: >-
          python -m pytest -q
          tests/test_alarm_engine_freshness.py
          tests/test_alarm_calculator_rule_guards.py
          tests/test_alarm_recent_incremental.py
          tests/test_alarm_recent_part2.py
          tests/test_alarm_recent_part3.py
          tests/test_current_table_sync.py
          tests/test_prematch_master_watchdog.py
          tests/test_runtime_scraper_recovery.py
          tests/test_sinyal_engine_runtime.py
          tests/test_analysis_signal_copy.py
          tests/test_fixture_integrity.py
          tests/test_learning_archive.py
          tests/test_learning_archive_api.py
          tests/test_learning_archive_lifecycle_guards.py