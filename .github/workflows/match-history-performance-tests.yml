name: Match History Performance Tests

on:
  push:
    branches: [preview]
    paths:
      - 'app.py'
      - 'services/supabase_client.py'
      - 'migrations/2026_10_07_match_history_bulk_rpc.sql'
      - 'tests/test_match_history_bulk_rpc.py'
      - '.github/workflows/match-history-performance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match-history-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest httpx requests certifi pytz flask python-dateutil
      - name: Compile runtime
        run: python -m py_compile app.py services/supabase_client.py
      - name: Run match-history performance regressions
        run: python -m pytest -q tests/test_match_history_bulk_rpc.py
